<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>狼人殺主持台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<!-- Firebase（免登入：背景用匿名連線，玩家不會看到任何登入畫面）-->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#fff1c9; --bg-elevated:#ffffff; --bg-sunken:#ffe39b;
    --text:#241b3a; --text-muted:#7a6a9c; --border:#241b3a;
    --dot:rgba(36,27,58,.07);
    --accent-wolf:#ff4d3d; --accent-wolf-soft:rgba(255,77,61,.18);
    --accent-brass:#ffb100; --accent-brass-soft:rgba(255,177,0,.22);
    --accent-good:#1fa971; --accent-good-soft:rgba(31,169,113,.18);
    --accent-focus:#6c5ce7; --accent-focus-soft:rgba(108,92,231,.16);
    --font-display:'Bangers',cursive; --font-body:'Noto Sans TC',sans-serif; --font-mono:'Bangers','Noto Sans TC',cursive;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1533; --bg-elevated:#2a2153; --bg-sunken:#140f28;
      --text:#f3eeff; --text-muted:#b8a9e0; --border:#cdbdf0;
      --dot:rgba(255,255,255,.06);
      --accent-wolf:#ff6b5b; --accent-wolf-soft:rgba(255,107,91,.22);
      --accent-brass:#ffce4d; --accent-brass-soft:rgba(255,206,77,.22);
      --accent-good:#4fd696; --accent-good-soft:rgba(79,214,150,.2);
      --accent-focus:#9c8fff; --accent-focus-soft:rgba(156,143,255,.2);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1533; --bg-elevated:#2a2153; --bg-sunken:#140f28;
    --text:#f3eeff; --text-muted:#b8a9e0; --border:#cdbdf0;
    --dot:rgba(255,255,255,.06);
    --accent-wolf:#ff6b5b; --accent-wolf-soft:rgba(255,107,91,.22);
    --accent-brass:#ffce4d; --accent-brass-soft:rgba(255,206,77,.22);
    --accent-good:#4fd696; --accent-good-soft:rgba(79,214,150,.2);
    --accent-focus:#9c8fff; --accent-focus-soft:rgba(156,143,255,.2);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background-color:var(--bg);color:var(--text);font-family:var(--font-body);
    background-image:radial-gradient(var(--dot) 1.6px, transparent 1.6px);
    background-size:16px 16px;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:32px;}
  h1,h2,h3{font-family:var(--font-body);font-weight:900;text-wrap:balance;margin:0;letter-spacing:.01em;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:.03em;}
  button{font-family:inherit;}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent-focus);outline-offset:2px;}
  a{color:inherit;}

  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg-elevated);border-bottom:3px solid var(--border);}
  .topbar .phase{flex:1;min-width:0;}
  .topbar .phase .label{font-size:11px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
  .topbar .phase .value{font-family:var(--font-body);font-weight:900;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dot{width:13px;height:13px;border-radius:50%;flex:none;border:2px solid var(--border);box-shadow:inset -2px -2px 0 rgba(0,0,0,.15);}
  .dot.ok{background:var(--accent-good);}
  .dot.bad{background:var(--accent-wolf);}
  .dot.pending{background:var(--accent-brass);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .iconbtn{border:2.5px solid var(--border);background:var(--bg-sunken);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--border);}
  .iconbtn:active{transform:translate(2px,2px);box-shadow:none;}

  .content{padding:16px;display:flex;flex-direction:column;gap:16px;flex:1;}
  .card{background:var(--bg-elevated);border:3px solid var(--border);border-radius:20px;padding:16px;box-shadow:5px 5px 0 var(--border);}
  .card + .card{margin-top:0;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:10px;}
  .row.wrap{flex-wrap:wrap;}
  .between{justify-content:space-between;}
  .muted{color:var(--text-muted);font-size:13px;}
  .small{font-size:12px;}
  .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);font-weight:700;}

  .btn{border:2.5px solid var(--border);background:var(--bg-sunken);color:var(--text);border-radius:14px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;text-align:center;box-shadow:3px 3px 0 var(--border);}
  .btn:active{transform:translate(3px,3px);box-shadow:none;}
  .btn-block{width:100%;}
  .btn-primary{background:var(--accent-focus);border-color:var(--border);color:#fff;}
  .btn-wolf{background:var(--accent-wolf);border-color:var(--border);color:#fff;}
  .btn-good{background:var(--accent-good);border-color:var(--border);color:#fff;}
  .btn-ghost{background:transparent;box-shadow:none;}
  .btn-ghost:active{box-shadow:none;}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:11px;box-shadow:2px 2px 0 var(--border);}
  .btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}
  .btngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:9px;}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;border:2px solid var(--border);transform:rotate(-2deg);}
  .badge-wolf{background:var(--accent-wolf-soft);color:var(--accent-wolf);border-color:var(--accent-wolf);}
  .badge-good{background:var(--accent-good-soft);color:var(--accent-good);border-color:var(--accent-good);}
  .badge-brass{background:var(--accent-brass-soft);color:var(--accent-brass);border-color:var(--accent-brass);}
  .badge-muted{background:var(--bg-sunken);color:var(--text-muted);border-color:var(--border);}

  .seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:11px;}
  .seat{position:relative;border:2.5px solid var(--border);border-radius:16px;background:var(--bg-sunken);padding:10px 6px 8px;text-align:center;cursor:pointer;box-shadow:3px 3px 0 var(--border);}
  .seat .num{font-family:var(--font-mono);font-weight:700;font-size:24px;line-height:1;}
  .seat .nick{font-size:11px;color:var(--text-muted);margin-top:3px;height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .seat.empty{border-style:dashed;color:var(--text-muted);box-shadow:none;}
  .seat.dead{opacity:.6;}
  .seat.dead::after{
    content:'OUT'; position:absolute; left:0; right:0; top:38%; padding:2px 0; overflow:hidden;
    font-family:var(--font-mono); font-size:14px; color:#fff; background:var(--accent-wolf);
    transform:rotate(-11deg); box-shadow:0 0 0 2px var(--border); letter-spacing:.08em; border-radius:3px;
  }
  .seat.me{border-color:var(--accent-focus);box-shadow:3px 3px 0 var(--accent-focus);}
  .seat.sheriff::before{
    content:'★'; position:absolute; top:-9px; right:-9px; width:22px; height:22px; z-index:2;
    background:var(--accent-brass); color:#fff; border:2px solid var(--border); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:12px;
    transform:rotate(14deg); box-shadow:2px 2px 0 var(--border);
  }
  .seat.selected{border-color:var(--accent-wolf);box-shadow:3px 3px 0 var(--accent-wolf);}

  .step{border-left:3px solid var(--border);padding:3px 0 3px 16px;position:relative;font-weight:500;}
  .step::before{content:'';position:absolute;left:-7px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--bg-sunken);border:2px solid var(--border);}
  .step.active{border-color:var(--accent-focus);font-weight:700;}
  .step.active::before{background:var(--accent-focus);}
  .step.done{border-color:var(--accent-good);color:var(--text-muted);}
  .step.done::before{background:var(--accent-good);}
  .step.skip{border-color:var(--bg-sunken);}
  .step.skip::before{background:var(--bg-sunken);border-color:var(--bg-sunken);}

  .gesture{position:relative;background:var(--accent-brass-soft);border:3px solid var(--accent-brass);border-radius:20px;padding:16px;margin-bottom:8px;}
  .gesture .big{font-family:var(--font-body);font-weight:900;font-size:16px;color:var(--accent-brass);}
  .gesture::after{content:'';position:absolute;left:32px;bottom:-13px;width:0;height:0;border:13px solid transparent;border-top-color:var(--accent-brass);border-bottom:0;}

  .vote-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;}
  .vote-bar-track{background:var(--bg-sunken);border:2.5px solid var(--border);border-radius:999px;height:26px;overflow:hidden;position:relative;}
  .vote-bar-fill{background:var(--accent-wolf);height:100%;border-radius:999px;transition:width .3s;}
  .vote-bar-label{position:absolute;inset:0;display:flex;align-items:center;padding-left:10px;font-family:var(--font-mono);font-size:13px;font-weight:700;}

  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:220px;margin:0 auto;}
  .pinpad button{padding:16px 0;font-size:20px;font-family:var(--font-mono);border-radius:14px;border:2.5px solid var(--border);background:var(--bg-sunken);color:var(--text);box-shadow:3px 3px 0 var(--border);}
  .pinpad button:active{transform:translate(3px,3px);box-shadow:none;}
  .pindots{display:flex;justify-content:center;gap:10px;margin:14px 0;}
  .pindots span{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--border);}
  .pindots span.fill{background:var(--accent-focus);border-color:var(--border);}

  .home-hero{padding:30px 20px 8px;text-align:center;}
  .home-hero .moon{font-size:46px;line-height:1;display:inline-block;animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-6px) rotate(3deg);}}
  .home-hero h1{font-size:30px;margin-top:8px;}
  .home-hero p{color:var(--text-muted);font-size:14px;margin-top:6px;font-weight:500;}

  .choice{display:flex;flex-direction:column;gap:14px;padding:0 16px 16px;}
  .choice-card{display:flex;align-items:center;gap:14px;border:3px solid var(--border);background:var(--bg-elevated);border-radius:20px;padding:16px;cursor:pointer;text-align:left;box-shadow:5px 5px 0 var(--border);}
  .choice-card:active{transform:translate(4px,4px);box-shadow:none;}
  .choice-card .ic{font-size:30px;}
  .choice-card h3{font-size:16px;}
  .choice-card p{margin:2px 0 0;color:var(--text-muted);font-size:12.5px;}

  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12.5px;color:var(--text-muted);font-weight:700;}
  .field input[type=text],.field select{padding:9px 10px;border-radius:11px;border:2.5px solid var(--border);background:var(--bg-sunken);color:var(--text);font-size:14px;}
  .stepper-ctrl{display:flex;align-items:center;gap:10px;}
  .stepper-ctrl button{width:32px;height:32px;border-radius:10px;border:2.5px solid var(--border);background:var(--bg-sunken);color:var(--text);font-size:16px;box-shadow:2px 2px 0 var(--border);}
  .stepper-ctrl button:active{transform:translate(2px,2px);box-shadow:none;}
  .stepper-ctrl .n{width:26px;text-align:center;font-family:var(--font-mono);font-weight:700;font-size:18px;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px dashed var(--border);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .t-label{font-size:13.5px;font-weight:700;}
  .toggle-row .t-desc{font-size:11.5px;color:var(--text-muted);}
  .switch{width:44px;height:26px;border-radius:99px;background:var(--bg-sunken);border:2.5px solid var(--border);position:relative;cursor:pointer;flex:none;}
  .switch::after{content:'';position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;background:var(--text-muted);border:2px solid var(--border);transition:.15s;}
  .switch.on{background:var(--accent-good-soft);}
  .switch.on::after{left:20px;background:var(--accent-good);}

  .log{display:flex;flex-direction:column;gap:7px;max-height:260px;overflow-y:auto;}
  .log-item{font-size:12.5px;color:var(--text-muted);border-left:3px solid var(--border);padding-left:9px;font-weight:500;}

  .win-banner{position:relative;overflow:hidden;background:var(--bg-elevated);border:4px solid var(--border);border-radius:24px;padding:26px 20px;text-align:center;box-shadow:6px 6px 0 var(--border);}
  .win-banner::before{
    content:'';position:absolute;inset:-40%;z-index:0;
    background:repeating-conic-gradient(var(--accent-brass-soft) 0deg 9deg, transparent 9deg 18deg);
    animation:spin 50s linear infinite;
  }
  .win-banner h2,.win-banner p{position:relative;z-index:1;}
  .win-banner h2{font-size:24px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .footer-actions{position:sticky;bottom:0;background:var(--bg-elevated);border-top:3px solid var(--border);padding:10px 16px;display:flex;gap:10px;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
'use strict';

/* ============ Firebase 設定 ============
   請到 https://console.firebase.google.com 建立一個免費專案，
   啟用 Firestore Database（正式模式）與 Authentication → Sign-in method → 匿名（Anonymous），
   接著把「專案設定→一般→你的應用程式」裡的 firebaseConfig 貼到下面取代這組範例值。 */
var firebaseConfig = {
  apiKey: "AIzaSyBXpyaLqEmzDqbEV9bxjqfmQeKGprunScY",
  authDomain: "wolf-game-f8a53.firebaseapp.com",
  projectId: "wolf-game-f8a53",
  storageBucket: "wolf-game-f8a53.firebasestorage.app",
  messagingSenderId: "994497565410",
  appId: "1:994497565410:web:1e176896f5334b326044bb"
};

/* ============ 角色登錄表 ============ */
var ROLES = {
  villager:{id:'villager',name:'平民',faction:'good_villager',night:false,desc:'無特殊能力。'},
  wolf:{id:'wolf',name:'狼人',faction:'wolf',night:true,nightGroup:'wolf',desc:'每晚與其他狼人共同睜眼，選擇一位玩家殺害。'},
  wolfking:{id:'wolfking',name:'狼王',faction:'wolf',night:true,nightGroup:'wolf',deathTrigger:true,desc:'與狼人一同睜眼行動；死亡時可開槍帶走一位玩家。'},
  whitewolfking:{id:'whitewolfking',name:'白狼王',faction:'wolf',night:true,nightGroup:'wolf',deathTrigger:true,dayDetonate:true,desc:'與狼人一同睜眼行動；白天可自爆並開槍帶走一位玩家，自爆後立即進入夜晚。'},
  wolfbeauty:{id:'wolfbeauty',name:'狼美人',faction:'wolf',night:true,nightGroup:'wolfbeauty',desc:'每晚魅惑一位玩家；狼美人死亡時，被魅惑者同歸於盡。'},
  seer:{id:'seer',name:'預言家',faction:'good_god',night:true,nightGroup:'seer',desc:'每晚查驗一位玩家的陣營（好人／狼人）。'},
  witch:{id:'witch',name:'女巫',faction:'good_god',night:true,nightGroup:'witch',desc:'持有解藥、毒藥各一瓶，可救人或毒人，皆限用一次。'},
  hunter:{id:'hunter',name:'獵人',faction:'good_god',night:false,deathTrigger:true,desc:'死亡時可開槍帶走一位玩家（若中毒身亡則依規則可能無法開槍）。'},
  guard:{id:'guard',name:'守衛',faction:'good_god',night:true,nightGroup:'guard',desc:'每晚守護一位玩家免於狼人攻擊；不可連續兩晚守同一人。'},
  idiot:{id:'idiot',name:'白痴',faction:'good_god',night:false,voteImmunity:true,desc:'被投票放逐時翻牌免死，但永久失去投票權。'},
  knight:{id:'knight',name:'騎士',faction:'good_god',night:false,duel:true,desc:'白天可指定一人決鬥：猜中狼人則對方死，猜錯則騎士死；每局限一次。'}
};
var ROLE_LIST=['villager','wolf','wolfking','whitewolfking','wolfbeauty','seer','witch','hunter','guard','idiot','knight'];
var FACTION_LABEL={wolf:'狼人陣營',good_god:'好人陣營・神職',good_villager:'好人陣營・平民'};
var FACTION_BADGE={wolf:'badge-wolf',good_god:'badge-good',good_villager:'badge-muted'};

function nightGroupOrder(rc){
  var front = rc.guardBeforeWolf!==false ? ['guard','wolf'] : ['wolf','guard'];
  var back = rc.witchBeforeSeer!==false ? ['witch','seer'] : ['seer','witch'];
  return front.concat(back);
}
var NIGHT_GROUP_LABEL={guard:'守衛',wolf:'狼人',witch:'女巫',seer:'預言家'};

/* ============ localStorage ============ */
var LS={
  get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

var ui={
  mode: LS.get('ww_mode', null),      // 'full' | 'pure'
  role: LS.get('ww_role', null),      // 'god' | 'player'
  seat: LS.get('ww_seat_full', null),
  pureSeat: LS.get('ww_seat_pure', null),
  pinBuf:'',
  view:'main',
  nickDraft:'',
  targetSel:null,
  setupDraft:null,
  speakDraft:null
};

var dbStatus='connecting'; // connecting | ok | unavailable
var db=null;
var state={ game:null, seats:{}, roles:{}, nightlog:{}, votes:{}, pure:null, pureSeats:{}, pureVotes:{} };

var $app=document.getElementById('app');

/* ============ DB init（Firebase，匿名連線，玩家全程不用登入）============ */
async function boot(){
  try{
    if(!firebaseConfig.apiKey || firebaseConfig.apiKey==='YOUR_API_KEY'){ dbStatus='unavailable'; render(); return; }
    firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInAnonymously();
    db = firebase.firestore();
  }catch(e){ db=null; dbStatus='unavailable'; render(); return; }
  if(!db){ dbStatus='unavailable'; render(); return; }
  dbStatus='ok';
  db.doc('game/state').onSnapshot(function(s){ state.game=s.exists?s.data():null; render(); }, function(){ dbStatus='unavailable'; render(); });
  db.collection('seats').onSnapshot(function(qs){ var m={}; qs.docs.forEach(function(d){m[d.id]=d.data();}); state.seats=m; render(); });
  db.collection('roles').onSnapshot(function(qs){ var m={}; qs.docs.forEach(function(d){m[d.id]=d.data();}); state.roles=m; render(); });
  db.collection('nightlog').onSnapshot(function(qs){ var m={}; qs.docs.forEach(function(d){m[d.id]=d.data();}); state.nightlog=m; render(); });
  db.collection('votes').onSnapshot(function(qs){ var m={}; qs.docs.forEach(function(d){m[d.id]=d.data();}); state.votes=m; render(); });
  db.doc('pure/state').onSnapshot(function(s){ state.pure=s.exists?s.data():null; render(); });
  db.collection('pureSeats').onSnapshot(function(qs){ var m={}; qs.docs.forEach(function(d){m[d.id]=d.data();}); state.pureSeats=m; render(); });
  db.collection('pureVotes').onSnapshot(function(qs){ var m={}; qs.docs.forEach(function(d){m[d.id]=d.data();}); state.pureVotes=m; render(); });
  render();
}
boot();
setTimeout(function(){ if(dbStatus==='connecting'){ dbStatus='unavailable'; render(); } },10500);

/* ============ 小工具 ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function seatNums(){ var n=(state.game&&state.game.totalSeats)||0; var a=[]; for(var i=1;i<=n;i++)a.push(i); return a; }
function seatData(n){ return state.seats[String(n)] || {seatNumber:n,occupied:false,alive:true}; }
function aliveSeatList(){ return seatNums().filter(function(n){ var s=seatData(n); return s.occupied && s.alive; }); }
function roleOfSeat(n){ var r=state.roles[String(n)]; return r?r.role:null; }
function roleAbilities(n){ var r=state.roles[String(n)]; return (r&&r.abilities)||{}; }
function findSeatsWithRole(roleId){ return seatNums().filter(function(n){return roleOfSeat(n)===roleId;}); }
function findAliveSeatWithRole(roleId){ return findSeatsWithRole(roleId).find(function(n){return seatData(n).alive;}); }
function nowIso(){ return new Date().toISOString(); }
function fmtWeight(w){ return (Math.round(w*10)/10).toFixed(w%1?1:0); }

function rc(){ return (state.game&&state.game.ruleConfig)||{}; }
function roleConfigCounts(){ return (state.game&&state.game.roleConfig)||{}; }

async function updateGame(patch){ await db.doc('game/state').update(patch); }
async function setGame(obj){ await db.doc('game/state').set(obj); }
async function updateSeat(n,patch){ await db.collection('seats').doc(String(n)).update(patch).catch(function(){ db.collection('seats').doc(String(n)).set(Object.assign({seatNumber:n,occupied:false,alive:true},patch)); }); }
async function setSeat(n,obj){ await db.collection('seats').doc(String(n)).set(obj); }
async function updateRole(n,patch){
  var ref=db.collection('roles').doc(String(n));
  var cur=state.roles[String(n)];
  if(cur){ await ref.update(patch); } else { await ref.set(Object.assign({seatNumber:n,role:null,abilities:{}},patch)); }
}
function claimSeat(collectionPath, seatId, data){
  var ref = db.collection(collectionPath).doc(String(seatId));
  return db.runTransaction(function(tx){
    return tx.get(ref).then(function(snap){
      if(snap.exists && snap.data().occupied){ return {claimed:false}; }
      tx.set(ref, data);
      return {claimed:true};
    });
  });
}
async function appendLog(text){
  var log=(state.game&&state.game.log)||[];
  log=log.concat([{t:nowIso(),text:text}]);
  if(log.length>200) log=log.slice(log.length-200);
  await updateGame({log:log});
}

function toggleSwitch(key,on){ return '<span class="switch'+(on?' on':'')+'" data-act="toggle" data-key="'+key+'"></span>'; }
function rangeArr(a,b){ var r=[]; for(var i=a;i<=b;i++)r.push(i); return r; }
function seatPickButtons(list,act,selected,extraData){
  return list.map(function(n){
    var sel = selected===n;
    return '<button class="btn btn-sm'+(sel?' btn-primary':'')+'" data-act="'+act+'" data-n="'+n+'"'+(extraData||'')+'>'+n+'</button>';

function renderPureVoteView(isGod){
  var vid = pureLatestVoteId();
  if(!vid || !state.pureVotes[vid]){
    return '<div class="card"><p class="muted">目前沒有進行中的投票。</p></div>';
  }
  var v = state.pureVotes[vid];
  var tally=tallyOf(v);
  var maxT = Math.max(1, Object.keys(tally).length? Math.max.apply(null,Object.values(tally)) : 1);
  var eligible = rangeArr(1,pureTotalSeats()).filter(function(n){return pureSeatData(n).occupied;});
  var html='<div class="card stack"><div class="row between"><h2>'+esc(v.label||'投票')+'</h2>'+(v.open?'<span class="badge badge-good">進行中</span>':'<span class="badge badge-muted">已結束</span>')+'</div>';
  if(isGod && v.sheriffSeat!=null){
    html += '<label class="toggle-row"><span><span class="t-label">警長歸票（算 1.5 票）</span><br><span class="t-desc">警長（'+v.sheriffSeat+'號）口頭宣告投給誰後再勾選</span></span>'+toggleSwitch('sheriffDeclare:'+v.id, v.sheriffDeclared)+'</label>';
  }
  eligible.forEach(function(n){
    var w=tally[n]||0;
    var pct = Math.round(w/maxT*100);
    var mine = ui.pureSeat===n;
    html += '<div class="vote-row">'
      + '<div class="mono" style="text-align:right;">'+n+'</div>'
      + '<div class="vote-bar-track"><div class="vote-bar-fill" style="width:'+pct+'%"></div><div class="vote-bar-label">'+fmtWeight(w)+' 票</div></div>'
      + (v.open && !isGod && ui.pureSeat!=null ? '<button class="btn btn-sm'+(v.choices&&v.choices[ui.pureSeat]===n?' btn-wolf':'')+'" data-act="pure-vote" data-target="'+n+'">投</button>' : '<span></span>')
      + '</div>';
  });
  if(v.open && ui.pureSeat!=null){
    html += '<p class="small muted">你目前是 '+ui.pureSeat+' 號座位'+(v.choices&&v.choices[ui.pureSeat]?'，已投給 '+v.choices[ui.pureSeat]+' 號':'，尚未投票')+'。</p>';
  }
  if(isGod && v.open){
    html += '<button class="btn btn-wolf btn-block" data-act="pure-close-vote">結束本輪投票</button>';
  }
  html += '</div>';
  return html;
}
function tallyOf(v){
  var t={}; var choices=v.choices||{};
  Object.keys(choices).forEach(function(seat){
    var target=choices[seat];
    var w = (v.sheriffSeat!=null && Number(seat)===Number(v.sheriffSeat) && v.sheriffDeclared) ? 1.5 : 1;
    t[target]=(t[target]||0)+w;
  });
  return t;
}

/* ---- Lobby（上帝端：登記身分 / 等玩家入座）---- */
function occupiedCount(){ return seatNums().filter(function(n){return seatData(n).occupied;}).length; }
function rolesRegisteredCount(){ return seatNums().filter(function(n){return !!roleOfSeat(n);}).length; }
function renderLobbyGod(){
  var total=state.game.totalSeats;
  var html='<div class="card stack"><h2>等待入座</h2>'
    + '<p class="muted">已入座 '+occupiedCount()+' / '+total+'。上帝 PIN：<span class="mono">'+esc(state.game.godPin)+'</span></p>'
    + renderSeatGridInline() + '</div>';
  html += '<div class="card stack"><h2>登記身分</h2><p class="muted small">依照實體發牌結果，把每個座位對應的角色選好；全部登記完成即可進入第一夜。</p>';
  seatNums().forEach(function(n){
    var s=seatData(n); var role=roleOfSeat(n);
    html += '<div class="row between"><div class="mono" style="width:28px;">'+n+'</div>'
      + '<div class="small muted" style="flex:1;">'+(s.occupied?esc(s.nickname||'（未取暱稱）'):'尚未入座')+'</div>'
      + '<select data-act="assign-role" data-n="'+n+'" style="padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg-sunken);color:var(--text);">'
      + '<option value="">－</option>'
      + ROLE_LIST.filter(function(r){return (roleConfigCounts()[r]||0)>0;}).map(function(r){return '<option value="'+r+'"'+(role===r?' selected':'')+'>'+ROLES[r].name+'</option>';}).join('')
      + '</select></div>';
  });
  var need = 0; ROLE_LIST.forEach(function(r){ need += roleConfigCounts()[r]||0; });
  var assignedByRole={}; seatNums().forEach(function(n){ var r=roleOfSeat(n); if(r) assignedByRole[r]=(assignedByRole[r]||0)+1; });
  var mismatch = ROLE_LIST.filter(function(r){ return (assignedByRole[r]||0) !== (roleConfigCounts()[r]||0); });
  if(mismatch.length){
    html += '<p class="small" style="color:var(--accent-brass);">尚未對齊設定：'+mismatch.map(function(r){return ROLES[r].name+'('+(assignedByRole[r]||0)+'/'+(roleConfigCounts()[r]||0)+')';}).join('、')+'</p>';
  }
  html += '<button class="btn btn-primary btn-block" data-act="start-night1" '+(mismatch.length||rolesRegisteredCount()<total?'disabled':'')+'>登記完成，天黑請閉眼（進入第一夜）</button>';
  html += '<button class="btn btn-ghost btn-block" data-act="reset-game">重置整局</button>';
  html += '</div>';
  return html;
}
function renderSeatGridInline(){
  var cells=seatNums().map(function(n){
    var s=seatData(n);

/* ---- 夜晚引擎 ---- */
function currentNightlogKey(){ return 'night-'+state.game.nightNumber; }
function currentNightlog(){ return state.nightlog[currentNightlogKey()] || {}; }
async function ensureNightlog(){
  var key=currentNightlogKey();
  if(!state.nightlog[key]){ await db.collection('nightlog').doc(key).set({night:state.game.nightNumber}); }
}
function activeNightGroups(){ return nightGroupOrder(rc()); }

function groupHasAliveRole(group){
  if(group==='guard') return !!findAliveSeatWithRole('guard');
  if(group==='witch') return !!findAliveSeatWithRole('witch');
  if(group==='seer') return !!findAliveSeatWithRole('seer');
  if(group==='wolf') return ['wolf','wolfking','whitewolfking'].some(function(r){return !!findAliveSeatWithRole(r);});
  return false;
}
function groupExistsInConfig(group){
  if(group==='guard') return (roleConfigCounts().guard||0)>0;
  if(group==='witch') return (roleConfigCounts().witch||0)>0;
  if(group==='seer') return (roleConfigCounts().seer||0)>0;
  if(group==='wolf') return ['wolf','wolfking','whitewolfking'].some(function(r){return (roleConfigCounts()[r]||0)>0;});
  return false;
}

/* ---- 死亡結算引擎（夜晚 & 白天共用）---- */
async function resolveNight(){
  var nl=currentNightlog();
  var deaths=[];
  var wolfTarget=nl.wolfTarget||0;
  if(wolfTarget){
    var savedByGuard = nl.guardTarget===wolfTarget;
    var savedByWitch = nl.antidoteTarget===wolfTarget;
    if(savedByGuard && savedByWitch && rc().guardWitchOverlapKills){ deaths.push({seat:wolfTarget,cause:'wolf'}); }
    else if(savedByGuard || savedByWitch){ /* 存活 */ }
    else { deaths.push({seat:wolfTarget,cause:'wolf'}); }
  }
  if(nl.poisonTarget){ deaths.push({seat:nl.poisonTarget,cause:'poison'}); }
  var seen={}; deaths=deaths.filter(function(d){ if(seen[d.seat])return false; seen[d.seat]=true; return true; });
  await startResolution(deaths,'night');
}
async function startResolution(deaths,context){
  await updateGame({ pending:{ queue:deaths, awaiting:null, context:context, resolvedText:[] } });
  await processPendingQueue();
}
async function processPendingQueue(){
  var g = state.game; if(!g || !g.pending) return;
  var pending = g.pending;
  if(pending.awaiting) return; // 等待上帝輸入
  var queue = pending.queue.slice();
  if(!queue.length){
    // 結算完成
    var texts = pending.resolvedText||[];
    for (var i=0;i<texts.length;i++) await appendLog(texts[i]);
    var context = pending.context;
    await updateGame({pending:null});
    var winner=checkWin();
    if(winner){ await updateGame({winner:winner}); return; }
    if(context==='night'){
      await updateGame({phase:'day', dayNumber:(state.game.dayNumber||0)+1, dayStage: (state.game.dayNumber||0)===0 && rc().sheriffEnabled ? 'sheriff_call' : 'speech_setup'});
    } else if(context==='detonate' || context==='day-after-vote'){
      await updateGame({phase:'night', nightNumber:(state.game.nightNumber||0)+1, nightStepIndex:0, dayStage:null});
    }
    return;
  }
  var d = queue.shift();
  var seatN = d.seat, cause=d.cause;
  var s = seatData(seatN);
  if(!s.alive){ // 已經死了，略過
    await updateGame({pending:Object.assign({},pending,{queue:queue})});
    return processPendingQueue();
  }
  var role = roleOfSeat(seatN);
  var texts = (pending.resolvedText||[]);
  if(role==='idiot' && cause==='vote' && !roleAbilities(seatN).idiotRevealed){
    await updateRole(seatN,{abilities:Object.assign({},roleAbilities(seatN),{idiotRevealed:true})});
    await updateSeat(seatN,{loseVoteRights:true});
    texts=texts.concat([seatN+' 號玩家身分公開，免於出局，但永久失去投票權。']);
    await updateGame({pending:Object.assign({},pending,{queue:queue,resolvedText:texts})});
    return processPendingQueue();
  }
  await updateSeat(seatN,{alive:false,deathCause:cause});
  texts=texts.concat([seatN+' 號玩家死亡。']);
  // 狼美人殉情
  var beautySeat = findSeatsWithRole('wolfbeauty')[0];
  if(beautySeat===seatN){
    var charmed = roleAbilities(seatN).charmedSeat;
    if(charmed && seatData(charmed).alive){
      queue.push({seat:charmed,cause:'heartbreak'});
    }
  }
  await updateGame({pending:Object.assign({},pending,{queue:queue,resolvedText:texts})});
  var roleDef = role?ROLES[role]:null;
  if(roleDef && roleDef.deathTrigger){
    var used = roleAbilities(seatN).shotUsed;
    var blockedByPoison = cause==='poison' && ((role==='hunter' && !rc().hunterCanShootIfPoisoned) || ((role==='wolfking'||role==='whitewolfking') && !rc().wolfKingCanShootIfPoisoned));
    if(!used && !blockedByPoison){
      await updateGame({pending:Object.assign({},pending,{queue:queue,resolvedText:texts,awaiting:{seat:seatN,role:role}})});
      return;
    }
  }
  return processPendingQueue();
}
function checkWin(){
  var alive = aliveSeatList();
  var wolfAlive=0, godAlive=0, villagerAlive=0, unknown=0;
  alive.forEach(function(n){
    var r=roleOfSeat(n);
    if(!r){ unknown++; return; }
    var f=ROLES[r].faction;
    if(f==='wolf') wolfAlive++; else if(f==='good_god') godAlive++; else villagerAlive++;
  });
  if(unknown>0) return null; // 尚未登記完整，不判斷
  if(wolfAlive===0) return 'good';
  if(rc().factionWin==='city'){ if(godAlive===0 && villagerAlive===0) return 'wolf'; }
  else { if(godAlive===0 || villagerAlive===0) return 'wolf'; }
  return null;
}
function renderPendingResolution(){
  var pending=state.game.pending;
  if(pending.awaiting){
    var seat=pending.awaiting.seat, role=pending.awaiting.role;
    var alive=aliveSeatList().filter(function(n){return n!==seat;});
    return '<div class="card stack"><h2>'+ROLES[role].name+'（'+seat+'號）死亡</h2><p class="muted small">是否開槍帶走一位玩家？</p>'
      + '<div class="btngrid">'+alive.map(function(n){return '<button class="btn btn-sm" data-act="pending-shoot" data-n="'+n+'">'+n+'</button>';}).join('')+'</div>'
      + '<button class="btn btn-ghost btn-block" data-act="pending-shoot" data-n="0">不開槍</button></div>';
  }
  return '<div class="card"><p class="muted">結算處理中…</p></div>';
}
async function actPendingShoot(n){
  var g=state.game; var pending=g.pending; var awaiting=pending.awaiting; var seat=awaiting.seat, role=awaiting.role;
  await updateRole(seat,{abilities:Object.assign({},roleAbilities(seat),{shotUsed:true})});
  var queue=pending.queue.slice();
  if(n) queue.push({seat:n,cause:'shot'});
  await updateGame({pending:Object.assign({},pending,{queue:queue,awaiting:null})});
  await processPendingQueue();
}

  var wwk = findAliveSeatWithRole('whitewolfking');

  var html='<div class="card stack"><h2>特殊技能</h2>';
  if(wwk){
    html += '<div class="row between"><span class="small muted">白狼王（'+wwk+'號）可自爆：立即死亡並開槍帶走一人，直接跳過剩餘白天流程進入夜晚。</span>'
      + '<button class="btn btn-wolf btn-sm" data-act="wwk-detonate" data-n="'+wwk+'">自爆</button></div>';
  }
  if(knightSeat && !knightUsed){

      var alive=aliveSeatList().filter(function(n){return n!==knightSeat;});
      html += '<div class="stack"><span class="small muted">騎士（'+knightSeat+'號）指定決鬥對象：</span>'
        + '<div class="btngrid">'+alive.map(function(n){return '<button class="btn btn-sm" data-act="knight-duel" data-k="'+knightSeat+'" data-n="'+n+'">'+n+'</button>';}).join('')+'</div>'
        + '<button class="btn btn-ghost btn-sm" data-act="knight-cancel">取消</button></div>';
    } else {
      html += '<div class="row between"><span class="small muted">騎士（'+knightSeat+'號）可發動決鬥，猜中狼人則對方死、猜錯則騎士死；每局限一次。</span>'
        + '<button class="btn btn-sm" data-act="knight-start">決鬥</button></div>';
    }
  }
  html += '</div>';

async function actConfirmCandidates(){

  if(cands.length<2){ var order=genOrder(cands, 'asc', cands[0]); await updateGame({speakingOrder:order, dayStage:'sheriff_vote'}); return; }
  var order = genOrder(cands, Math.random()<0.5?'asc':'desc', cands[Math.floor(Math.random()*cands.length)]);
  await updateGame({speakingOrder:order, dayStage:'sheriff_speech'});
}
function genOrder(list, dir, start){
  var arr=list.slice().sort(function(a,b){return a-b;});
  var si=arr.indexOf(start); if(si<0) si=0;
  var out=[];
  for(var i=0;i<arr.length;i++){
    var idx = dir==='asc' ? (si+i)%arr.length : ((si-i)%arr.length+arr.length)%arr.length;
    out.push(arr[idx]);
  }
  return out;
}

function renderVoteCardFull(v,godView){
  var tally=tallyOf(v);
  var candidates = v.candidates || aliveSeatList();
  var maxT=Math.max(1, candidates.length?Math.max.apply(null,candidates.map(function(n){return tally[n]||0;})):1);
  var html='<div class="card stack"><h2>'+esc(v.label)+'</h2>';
  if(godView && v.sheriffSeat!=null){
    html += '<label class="toggle-row"><span><span class="t-label">警長歸票（算 1.5 票）</span><br><span class="t-desc">警長（'+v.sheriffSeat+'號）口頭宣告投給誰後再勾選</span></span>'+toggleSwitch('sheriffDeclare:'+v.id, v.sheriffDeclared)+'</label>';
  }
  candidates.forEach(function(n){
    var w=tally[n]||0; var pct=Math.round(w/maxT*100);
    html += '<div class="vote-row"><div class="mono" style="text-align:right;">'+n+'</div>'
      + '<div class="vote-bar-track"><div class="vote-bar-fill" style="width:'+pct+'%"></div><div class="vote-bar-label">'+fmtWeight(w)+' 票</div></div>'
      + (!godView && v.open && ui.seat!=null && v.voters.indexOf(ui.seat)>=0 ? '<button class="btn btn-sm'+(v.choices&&v.choices[ui.seat]===n?' btn-wolf':'')+'" data-act="cast-vote" data-vid="'+v.id+'" data-target="'+n+'">投</button>' : '<span></span>')
      + '</div>';
  });
  html += '</div>';
  return html;
}
function renderSheriffDeclareStep(v,kind){
  var html='<div class="card stack"><h2>結果確認</h2><p class="muted small">「警長歸票」開關在上方票數卡片裡，確認無誤後再判定結果。</p>';
  var tally=tallyOf(v);
  var candidates=v.candidates||aliveSeatList();
  var sorted=candidates.slice().sort(function(a,b){return (tally[b]||0)-(tally[a]||0);});
  var top=tally[sorted[0]]||0;
  var tied=sorted.filter(function(n){return (tally[n]||0)===top && top>0;});
  if(tied.length>1){
    html += '<p class="small" style="color:var(--accent-brass);">平票：'+tied.join('、')+' 號，請主持人依現場規則處理（重新發言投票 / 平安夜 / 上帝裁定）。</p>';
    html += '<button class="btn btn-ghost btn-block" data-act="finish-vote" data-kind="'+kind+'" data-result="tie">記為平票，暫不出局</button>';
  } else if(top>0){
    html += '<p class="small">最高票：'+sorted[0]+' 號（'+fmtWeight(top)+' 票）。</p>';
    html += '<button class="btn btn-wolf btn-block" data-act="finish-vote" data-kind="'+kind+'" data-result="'+sorted[0]+'">確認結果</button>';
  } else {
    html += '<p class="small muted">目前尚無票數。</p>';
  }
  html += '</div>';
  return html;
}
async function actOpenVote(kind){
  var candidates = kind==='sheriff' ? (state.game.candidates||[]) : aliveSeatList();
  var voters = aliveSeatList().filter(function(n){ return !seatData(n).loseVoteRights; });
  var id='round-'+Date.now();
  await db.collection('votes').doc(id).set({id:id,kind:kind,label:kind==='sheriff'?'警長選舉投票':('第 '+state.game.dayNumber+' 天放逐投票'),candidates:candidates,voters:voters,sheriffSeat: kind==='lynch'?state.game.sheriffSeat:null, sheriffDeclared:false, choices:{}, open:true, resolved:false, createdAt:nowIso()});

async function actFinishVote(kind,result){
  var vid=state.game.activeVoteId;
  await db.collection('votes').doc(vid).update({resolved:true});
  if(result==='tie'){
    if(kind==='sheriff'){ await updateGame({dayStage:'speech_setup', activeVoteId:null, candidates:[]}); }
    else { await appendLog('第 '+state.game.dayNumber+' 天投票結果平票，本輪無人出局。'); await updateGame({dayStage:null, phase:'night', nightNumber:(state.game.nightNumber||0)+1, nightStepIndex:0, activeVoteId:null}); }
    return;
  }
  var target=Number(result);
  if(kind==='sheriff'){
    await updateGame({sheriffSeat:target, activeVoteId:null, candidates:[], dayStage:'speech_setup'});
    await appendLog(target+' 號當選警長。');
  } else {
    await updateGame({activeVoteId:null});
    if(state.game.sheriffSeat===target){
      await updateGame({dayStage:'badge_transfer'});
    } else {
      await startResolution([{seat:target,cause:'vote'}],'day-after-vote');
      await updateGame({dayStage:null});
    }
  }
}

/* ============ Event 綁定 ============ */
$app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act=el.getAttribute('data-act');
  handleAction(act, el);
});
$app.addEventListener('change', function(e){
  var el=e.target;
  if(el.matches('select[data-act="assign-role"]')){
    var n=Number(el.getAttribute('data-n'));
    updateRole(n,{role: el.value||null});
  }
  if(el.matches('select[data-act="select"]')){
    var key=el.getAttribute('data-key');
    if(ui.setupDraft){ ui.setupDraft.ruleConfig[key]=el.value; render(); }
  }
  if(el.matches('[data-act="pin-draft"]')){
    if(ui.setupDraft){ ui.setupDraft.pin=el.value; }
  }
});

function handleAction(act, el){
  if(act==='home'){ ui.view='mode-select'; render(); return; }
  if(act==='goto'){ ui.view=el.getAttribute('data-view'); render(); return; }
  if(act==='pick-mode'){
    var m=el.getAttribute('data-mode');
    if(m==='full'||m==='pure'){ ui.mode=m; LS.set('ww_mode',m); ui.view='main'; render(); return; }
    if(m==='__pure_god'){ ui.role='puregod'; render(); return; }
    if(m==='__pure_player'){ ui.role='pureplayer'; render(); return; }
    if(m==='__full_god'){ ui.role='fullgod'; render(); return; }
    if(m==='__full_player'){ ui.role='fullplayer'; render(); return; }
  }
  if(act==='switch-identity'){ ui.role=null; render(); return; }

  if(act==='pure-n'){
    var d=Number(el.getAttribute('data-d'));
    ui.setupDraft=ui.setupDraft||{}; ui.setupDraft.pureSeats=Math.max(2,Math.min(30,(ui.setupDraft.pureSeats||8)+d)); render(); return;
  }
  if(act==='pure-create'){
    var n=Number(el.getAttribute('data-n'));
    db.doc('pure/state').set({totalSeats:n, sheriffSeat:null, activeVoteId:null}); return;
  }
  if(act==='pure-claim'){
    var n=Number(el.getAttribute('data-n'));
    var nick=prompt('輸入暱稱（可留空）','')||'';
    claimSeat('pureSeats', n, {seatNumber:n,occupied:true,nickname:nick}).then(function(res){
      if(res.claimed){ ui.pureSeat=n; LS.set('ww_seat_pure',n); render(); }
      else { alert('這個座位已經有人了，請選其他座位。'); }
    });
    return;
  }
  if(act==='pure-set-sheriff'){
    var n=Number(el.getAttribute('data-n'));
    db.doc('pure/state').update({sheriffSeat: state.pure.sheriffSeat===n?null:n}); return;
  }
  if(act==='pure-reset'){
    Object.keys(state.pureSeats).forEach(function(k){ db.collection('pureSeats').doc(k).delete(); });
    db.doc('pure/state').set({totalSeats:0, sheriffSeat:null, activeVoteId:null});
    ui.pureSeat=null; LS.set('ww_seat_pure',null); return;
  }
  if(act==='pure-start-vote'){
    var label=($app.querySelector('#pureVoteLabel')||{}).value || '投票';
    var eligible=rangeArr(1,pureTotalSeats()).filter(function(n){return pureSeatData(n).occupied;});
    var id='pv-'+Date.now();
    db.collection('pureVotes').doc(id).set({id:id,label:label,candidates:eligible,voters:eligible,sheriffSeat:state.pure.sheriffSeat,sheriffDeclared:false,choices:{},open:true,createdAt:nowIso()});
    db.doc('pure/state').update({activeVoteId:id});
    return;
  }
  if(act==='pure-vote'){
    var target=Number(el.getAttribute('data-target'));
    var vid=pureLatestVoteId();
    if(ui.pureSeat==null){ alert('請先入座才能投票。'); return; }
    var choices=Object.assign({}, state.pureVotes[vid].choices);
    choices[ui.pureSeat]=target;
    db.collection('pureVotes').doc(vid).update({choices:choices});
    return;
  }
  if(act==='pure-close-vote'){
    var vid=pureLatestVoteId();
    db.collection('pureVotes').doc(vid).update({open:false});
    return;
  }

  if(act==='pin-key'){
    var k=el.getAttribute('data-k');
    if(k==='⌫'){ ui.pinBuf=ui.pinBuf.slice(0,-1); }
    else if(ui.pinBuf.length<4){ ui.pinBuf+=k; }
    if(ui.pinBuf.length===4){
      if(ui.pinBuf===state.game.godPin){ LS.set('ww_god_pin',ui.pinBuf); ui.pinBuf=''; render(); }
      else { alert('PIN 錯誤'); ui.pinBuf=''; render(); }
    } else render();
    return;
  }
  if(act==='role-n'){
    var r=el.getAttribute('data-r'); var d=Number(el.getAttribute('data-d'));
    ui.setupDraft.roleConfig[r]=Math.max(0,(ui.setupDraft.roleConfig[r]||0)+d); render(); return;
  }
  if(act==='toggle'){
    var key=el.getAttribute('data-key');
    if(key.indexOf('rule:')===0){
      var rk=key.slice(5); ui.setupDraft.ruleConfig[rk]=!ui.setupDraft.ruleConfig[rk]; render(); return;
    }
    if(key.indexOf('sheriffDeclare:')===0){
      var vid=key.slice(15);
      var v=state.votes[vid]||state.pureVotes[vid];
      var coll = state.votes[vid] ? 'votes' : 'pureVotes';
      db.collection(coll).doc(vid).update({sheriffDeclared: !v.sheriffDeclared});
      return;
    }
  }
  if(act==='create-game'){
    var d=ui.setupDraft;
    var total=0; ROLE_LIST.forEach(function(r){total+=d.roleConfig[r]||0;});
    if(total<3){ alert('人數太少，至少需要 3 人。'); return; }
    db.doc('game/state').set({
      phase:'lobby', dayNumber:0, nightNumber:1, nightStepIndex:0,
      roleConfig:d.roleConfig, ruleConfig:d.ruleConfig, totalSeats:total,
      godPin:d.pin, sheriffSeat:null, candidates:[], speakingOrder:[], activeVoteId:null,
      dayStage:null, winner:null, log:[{t:nowIso(),text:'上帝建立了新的一局，共 '+total+' 人。'}], pending:null
    });
    LS.set('ww_god_pin', d.pin);
    ui.setupDraft=null; return;
  }
  if(act==='claim-seat'){
    var n=Number(el.getAttribute('data-n'));
    var nick=prompt('輸入暱稱（可留空）','')||'';
    claimSeat('seats', n, {seatNumber:n,occupied:true,nickname:nick,alive:true}).then(function(res){
      if(res.claimed){ ui.seat=n; LS.set('ww_seat_full',n); render(); }
      else { alert('這個座位已經有人了，請選其他座位。'); }
    });
    return;
  }
  if(act==='assign-role'){ return; }
  if(act==='start-night1'){
    db.doc('game/state').update({phase:'night'}); return;
  }
  if(act==='reset-game'){
    if(!confirm('確定要重置整局嗎？所有座位、角色、投票紀錄都會清空。')) return;
    Object.keys(state.seats).forEach(function(k){ db.collection('seats').doc(k).delete(); });
    Object.keys(state.roles).forEach(function(k){ db.collection('roles').doc(k).delete(); });
    Object.keys(state.nightlog).forEach(function(k){ db.collection('nightlog').doc(k).delete(); });
    Object.keys(state.votes).forEach(function(k){ db.collection('votes').doc(k).delete(); });
    db.doc('game/state').delete();
    ui.seat=null; LS.set('ww_seat_full',null);
    return;
  }
  if(act==='toggle-alive'){
    var n=Number(el.getAttribute('data-n'));
    updateSeat(n,{alive: !seatData(n).alive}); return;
  }
  if(act==='clear-seat'){
    var n=Number(el.getAttribute('data-n'));
    if(!confirm(n+' 號座位清空？')) return;
    db.collection('seats').doc(String(n)).delete();
    if(ui.seat===n){ ui.seat=null; LS.set('ww_seat_full',null); }
    return;
  }
  if(act==='night-skip'){ nightAdvance(); return; }
  if(act==='night-guard'){ actNightGuard(Number(el.getAttribute('data-n'))); return; }
  if(act==='night-wolf'){ actNightWolf(Number(el.getAttribute('data-n'))); return; }
  if(act==='night-charm'){ actNightCharm(Number(el.getAttribute('data-n'))); return; }
  if(act==='night-witch-save'){ actWitchSave(Number(el.getAttribute('data-n'))); return; }
  if(act==='night-witch-nosave'){ render(); return; }
  if(act==='night-witch-poison'){ actWitchPoison(Number(el.getAttribute('data-n'))); return; }
  if(act==='night-witch-done'){ nightAdvance(); return; }
  if(act==='night-seer'){ actNightSeer(Number(el.getAttribute('data-n'))); return; }
  if(act==='resolve-night'){ resolveNight(); return; }
  if(act==='pending-shoot'){ actPendingShoot(Number(el.getAttribute('data-n'))); return; }

  if(act==='toggle-candidate'){
    var n=Number(el.getAttribute('data-n'));
    var cands=(state.game.candidates||[]).slice();
    var i=cands.indexOf(n);
    if(i>=0) cands.splice(i,1); else cands.push(n);
    updateGame({candidates:cands}); return;
  }
  if(act==='confirm-candidates'){ actConfirmCandidates(); return; }
  if(act==='skip-sheriff'){ updateGame({dayStage:'speech_setup', sheriffSeat:null}); return; }
  if(act==='goto-sheriff-vote'){ updateGame({dayStage:'sheriff_vote'}); return; }
  if(act==='goto-lynch-vote'){ updateGame({dayStage:'lynch_vote'}); return; }
  if(act==='gen-speech'){ actGenSpeech(el.getAttribute('data-dir')); return; }
  if(act==='confirm-speech'){ updateGame({dayStage:'speech'}); return; }
  if(act==='open-vote'){ actOpenVote(el.getAttribute('data-kind')); return; }
  if(act==='close-vote'){ actCloseVote(); return; }
  if(act==='cast-vote'){
    var vid=el.getAttribute('data-vid'); var target=Number(el.getAttribute('data-target'));
    if(ui.seat==null){ alert('請先入座才能投票。'); return; }
    var v=state.votes[vid];
    if(v.voters.indexOf(ui.seat)<0){ alert('這一輪投票你沒有投票資格。'); return; }
    var choices=Object.assign({},v.choices); choices[ui.seat]=target;
    db.collection('votes').doc(vid).update({choices:choices}); return;
  }
  if(act==='finish-vote'){ actFinishVote(el.getAttribute('data-kind'), el.getAttribute('data-result')); return; }
  if(act==='transfer-badge'){ actTransferBadge(Number(el.getAttribute('data-n'))); return; }
  if(act==='wwk-detonate'){
    if(!confirm('確定自爆嗎？會立即死亡並跳過剩餘白天流程進入夜晚。')) return;
    actWhiteWolfDetonate(Number(el.getAttribute('data-n'))); return;
  }
  if(act==='knight-start'){ ui.targetSel='knight'; render(); return; }
  if(act==='knight-cancel'){ ui.targetSel=null; render(); return; }
  if(act==='knight-duel'){
    ui.targetSel=null;
    actKnightDuel(Number(el.getAttribute('data-k')), Number(el.getAttribute('data-n')));
    return;
  }
}

})();
</script>
