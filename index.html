<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>狼人殺主持台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<!-- Firebase（免登入：背景用匿名連線，玩家不會看到任何登入畫面）-->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-check-compat.js"></script>
<style>
  /* --font-mono 原本是 'Bangers'（跟標題同一套裝飾字體），拿來排座位號碼／票數這種
     一定要讓上帝在快節奏中準確辨識的數字時，數字造型太花俏容易看錯（曾被回報「7 號看
     成 1 號」），改成跟內文一樣的 Noto Sans TC，犧牲一點裝飾感換清楚易讀。 */
  :root{
    --bg:#fff1c9; --bg-elevated:#ffffff; --bg-sunken:#ffe39b;
    --text:#241b3a; --text-muted:#7a6a9c; --border:#241b3a;
    --dot:rgba(36,27,58,.07);
    --accent-wolf:#ff4d3d; --accent-wolf-soft:rgba(255,77,61,.18);
    --accent-brass:#ffb100; --accent-brass-soft:rgba(255,177,0,.22);
    --accent-good:#1fa971; --accent-good-soft:rgba(31,169,113,.18);
    --accent-focus:#6c5ce7; --accent-focus-soft:rgba(108,92,231,.16);
    --font-display:'Bangers',cursive; --font-body:'Noto Sans TC',sans-serif; --font-mono:'Noto Sans TC',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1533; --bg-elevated:#2a2153; --bg-sunken:#140f28;
      --text:#f3eeff; --text-muted:#b8a9e0; --border:#cdbdf0;
      --dot:rgba(255,255,255,.06);
      --accent-wolf:#ff6b5b; --accent-wolf-soft:rgba(255,107,91,.22);
      --accent-brass:#ffce4d; --accent-brass-soft:rgba(255,206,77,.22);
      --accent-good:#4fd696; --accent-good-soft:rgba(79,214,150,.2);
      --accent-focus:#9c8fff; --accent-focus-soft:rgba(156,143,255,.2);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1533; --bg-elevated:#2a2153; --bg-sunken:#140f28;
    --text:#f3eeff; --text-muted:#b8a9e0; --border:#cdbdf0;
    --dot:rgba(255,255,255,.06);
    --accent-wolf:#ff6b5b; --accent-wolf-soft:rgba(255,107,91,.22);
    --accent-brass:#ffce4d; --accent-brass-soft:rgba(255,206,77,.22);
    --accent-good:#4fd696; --accent-good-soft:rgba(79,214,150,.2);
    --accent-focus:#9c8fff; --accent-focus-soft:rgba(156,143,255,.2);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background-color:var(--bg);color:var(--text);font-family:var(--font-body);
    background-image:radial-gradient(var(--dot) 1.6px, transparent 1.6px);
    background-size:16px 16px;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:32px;}
  h1,h2,h3{font-family:var(--font-body);font-weight:900;text-wrap:balance;margin:0;letter-spacing:.01em;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:.03em;}
  button{font-family:inherit;}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent-focus);outline-offset:2px;}
  a{color:inherit;}

  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg-elevated);border-bottom:3px solid var(--border);}
  .topbar .phase{flex:1;min-width:0;}
  .topbar .phase .label{font-size:11px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
  .topbar .phase .value{font-family:var(--font-body);font-weight:900;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dot{width:13px;height:13px;border-radius:50%;flex:none;border:2px solid var(--border);box-shadow:inset -2px -2px 0 rgba(0,0,0,.15);}
  .dot.ok{background:var(--accent-good);}
  .dot.bad{background:var(--accent-wolf);}
  .dot.pending{background:var(--accent-brass);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .iconbtn{border:2.5px solid var(--border);background:var(--bg-sunken);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--border);}
  .iconbtn:active{transform:translate(2px,2px);box-shadow:none;}

  .content{padding:16px;display:flex;flex-direction:column;gap:16px;flex:1;}
  .card{background:var(--bg-elevated);border:3px solid var(--border);border-radius:20px;padding:16px;box-shadow:5px 5px 0 var(--border);}
  .card + .card{margin-top:0;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:10px;}
  .row.wrap{flex-wrap:wrap;}
  .between{justify-content:space-between;}
  .muted{color:var(--text-muted);font-size:13px;}
  .small{font-size:12px;}
  .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);font-weight:700;}

  .btn{border:2.5px solid var(--border);background:var(--bg-sunken);color:var(--text);border-radius:14px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;text-align:center;box-shadow:3px 3px 0 var(--border);}
  .btn:active{transform:translate(3px,3px);box-shadow:none;}
  .btn-block{width:100%;}
  .btn-primary{background:var(--accent-focus);border-color:var(--border);color:#fff;}
  .btn-wolf{background:var(--accent-wolf);border-color:var(--border);color:#fff;}
  .btn-good{background:var(--accent-good);border-color:var(--border);color:#fff;}
  .btn-ghost{background:transparent;box-shadow:none;}
  .btn-ghost:active{box-shadow:none;}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:11px;box-shadow:2px 2px 0 var(--border);}
  .btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}
  .btngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:9px;}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;border:2px solid var(--border);transform:rotate(-2deg);}
  .badge-wolf{background:var(--accent-wolf-soft);color:var(--accent-wolf);border-color:var(--accent-wolf);}
  .badge-good{background:var(--accent-good-soft);color:var(--accent-good);border-color:var(--accent-good);}
  .badge-brass{background:var(--accent-brass-soft);color:var(--accent-brass);border-color:var(--accent-brass);}
  .badge-muted{background:var(--bg-sunken);color:var(--text-muted);border-color:var(--border);}

  .seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:11px;}
  .seat{position:relative;border:2.5px solid var(--border);border-radius:16px;background:var(--bg-sunken);padding:10px 6px 8px;text-align:center;cursor:pointer;box-shadow:3px 3px 0 var(--border);}
  .seat .num{font-family:var(--font-mono);font-weight:700;font-size:24px;line-height:1;}
  .seat .nick{font-size:11px;color:var(--text-muted);margin-top:3px;height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .seat.empty{border-style:dashed;color:var(--text-muted);box-shadow:none;}
  .seat.tagged{background:var(--accent-good-soft);}
  /* 座位管理：標記身份後依角色分色，比單一綠色更好辨識是哪個角色（守衛藍天藍／女巫鮮紅／
     預言家桃紫／獵人亮黃／狼人陣營（含狼王/白狼王/狼美人）深紅／平民較暗的黃，
     其餘角色還沒指定顏色、維持上面的 .tagged 綠色）。
     宣告順序要放在 .tagged 之後、.dead 之前，才能蓋過綠色，又會被死亡狀態蓋過去。 */
  .seat[class*="role-"]{color:#fff;}
  .seat[class*="role-"] .nick{color:rgba(255,255,255,.85);}
  .seat.role-hunter,.seat.role-villager{color:#241b3a;}
  .seat.role-hunter .nick,.seat.role-villager .nick{color:rgba(36,27,58,.7);}
  .seat.role-guard{background:#0ea5e9;}
  .seat.role-witch{background:#f20000;}
  .seat.role-seer{background:#8e2a8e;}
  .seat.role-hunter{background:#ffe600;}
  .seat.role-wolf{background:#8b0000;}
  .seat.role-villager{background:#e6c200;}
  .seat.dead{opacity:.75;border-color:var(--accent-wolf);box-shadow:3px 3px 0 var(--accent-wolf);background:var(--accent-wolf-soft);color:var(--text);}
  .seat.dead .nick{color:var(--text-muted);}
  .seat.dead::after{
    content:'OUT'; position:absolute; left:0; right:0; top:38%; padding:2px 0; overflow:hidden;
    font-family:var(--font-mono); font-size:14px; color:#fff; background:var(--accent-wolf);
    transform:rotate(-11deg); box-shadow:0 0 0 2px var(--border); letter-spacing:.08em; border-radius:3px;
  }
  .seat.me{border-color:var(--accent-focus);box-shadow:3px 3px 0 var(--accent-focus);}
  .seat.sheriff::before{
    content:'👑'; position:absolute; top:-9px; right:-9px; width:22px; height:22px; z-index:2;
    background:var(--accent-brass); border:2px solid var(--border); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1;
    transform:rotate(14deg); box-shadow:2px 2px 0 var(--border);
  }
  .seat.selected{border-color:var(--accent-wolf);box-shadow:3px 3px 0 var(--accent-wolf);}

  .step{border-left:3px solid var(--border);padding:3px 0 3px 16px;position:relative;font-weight:500;}
  .step::before{content:'';position:absolute;left:-7px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--bg-sunken);border:2px solid var(--border);}
  .step.active{border-color:var(--accent-focus);font-weight:700;}
  .step.active::before{background:var(--accent-focus);}
  .step.done{border-color:var(--accent-good);color:var(--text-muted);}
  .step.done::before{background:var(--accent-good);}
  .step.skip{border-color:var(--bg-sunken);}
  .step.skip::before{background:var(--bg-sunken);border-color:var(--bg-sunken);}


  .vote-breakdown-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border:2.5px solid var(--border);border-radius:13px;background:var(--bg-sunken);box-shadow:2px 2px 0 var(--border);}
  .vote-breakdown-row .arrow{color:var(--text-muted);font-weight:900;font-size:15px;}
  .vote-breakdown-row.abstain{opacity:.75;border-style:dashed;box-shadow:none;}
  .vote-breakdown-row.pending{border-style:dashed;box-shadow:none;opacity:.65;background:transparent;}

  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:220px;margin:0 auto;}
  .pinpad button{padding:16px 0;font-size:20px;font-family:var(--font-mono);border-radius:14px;border:2.5px solid var(--border);background:var(--bg-sunken);color:var(--text);box-shadow:3px 3px 0 var(--border);}
  .pinpad button:active{transform:translate(3px,3px);box-shadow:none;}
  .pindots{display:flex;justify-content:center;gap:10px;margin:14px 0;}
  .pindots span{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--border);}
  .pindots span.fill{background:var(--accent-focus);border-color:var(--border);}

  .home-hero{padding:30px 20px 8px;text-align:center;}
  .home-hero .moon{font-size:46px;line-height:1;display:inline-block;animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-6px) rotate(3deg);}}
  .home-hero h1{font-size:30px;margin-top:8px;}
  .home-hero p{color:var(--text-muted);font-size:14px;margin-top:6px;font-weight:500;}

  .choice{display:flex;flex-direction:column;gap:14px;padding:0 16px 16px;}
  .choice-card{display:flex;align-items:center;gap:14px;border:3px solid var(--border);background:var(--bg-elevated);border-radius:20px;padding:16px;cursor:pointer;text-align:left;box-shadow:5px 5px 0 var(--border);}
  .choice-card:active{transform:translate(4px,4px);box-shadow:none;}
  .choice-card .ic{font-size:30px;}
  .choice-card h3{font-size:16px;}
  .choice-card p{margin:2px 0 0;color:var(--text-muted);font-size:12.5px;}

  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12.5px;color:var(--text-muted);font-weight:700;}
  .field input[type=text],.field select{padding:9px 10px;border-radius:11px;border:2.5px solid var(--border);background:var(--bg-sunken);color:var(--text);font-size:14px;}
  .stepper-ctrl{display:flex;align-items:center;gap:10px;}
  .stepper-ctrl button{width:32px;height:32px;border-radius:10px;border:2.5px solid var(--border);background:var(--bg-sunken);color:var(--text);font-size:16px;box-shadow:2px 2px 0 var(--border);}
  .stepper-ctrl button:active{transform:translate(2px,2px);box-shadow:none;}
  .stepper-ctrl .n{min-width:26px;text-align:center;font-family:var(--font-mono);font-weight:700;font-size:18px;padding:0 2px;}

  details summary{font-family:var(--font-body);font-weight:900;font-size:17px;cursor:pointer;list-style:none;}
  details summary::-webkit-details-marker{display:none;}
  details summary::before{content:'▸ ';display:inline-block;transition:transform .15s;}
  details[open] summary::before{transform:rotate(90deg);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px dashed var(--border);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .t-label{font-size:13.5px;font-weight:700;}
  .toggle-row .t-desc{font-size:11.5px;color:var(--text-muted);}
  .switch{width:44px;height:26px;border-radius:99px;background:var(--bg-sunken);border:2.5px solid var(--border);position:relative;cursor:pointer;flex:none;}
  .switch::after{content:'';position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;background:var(--text-muted);border:2px solid var(--border);transition:.15s;}
  .switch.on{background:var(--accent-good-soft);}
  .switch.on::after{left:20px;background:var(--accent-good);}

  .log{display:flex;flex-direction:column;gap:7px;max-height:260px;overflow-y:auto;}
  .log-item{font-size:12.5px;color:var(--text-muted);border-left:3px solid var(--border);padding-left:9px;font-weight:500;}

  .win-banner{position:relative;overflow:hidden;background:var(--bg-elevated);border:4px solid var(--border);border-radius:24px;padding:26px 20px;text-align:center;box-shadow:6px 6px 0 var(--border);}
  .win-banner::before{
    content:'';position:absolute;inset:-40%;z-index:0;
    background:repeating-conic-gradient(var(--accent-brass-soft) 0deg 9deg, transparent 9deg 18deg);
    animation:spin 50s linear infinite;
  }
  .win-banner h2,.win-banner p{position:relative;z-index:1;}
  .win-banner h2{font-size:24px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .footer-actions{position:sticky;bottom:0;background:var(--bg-elevated);border-top:3px solid var(--border);padding:10px 16px;display:flex;gap:10px;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
'use strict';

/* ============ Firebase 設定 ============
   請到 https://console.firebase.google.com 建立一個免費專案，
   啟用 Firestore Database（正式模式）與 Authentication → Sign-in method → 匿名（Anonymous），
   接著把「專案設定→一般→你的應用程式」裡的 firebaseConfig 貼到下面取代這組範例值。 */
var firebaseConfig = {
  apiKey: "AIzaSyBXpyaLqEmzDqbEV9bxjqfmQeKGprunScY",
  authDomain: "wolf-game-f8a53.firebaseapp.com",
  projectId: "wolf-game-f8a53",
  storageBucket: "wolf-game-f8a53.firebasestorage.app",
  messagingSenderId: "994497565410",
  appId: "1:994497565410:web:1e176896f5334b326044bb"
};

/* ============ App Check（評估過，目前決定不裝，詳見 README「App Check」一節）============
   骨架先留著、保持 YOUR_RECAPTCHA_SITE_KEY 不動即可，App 會照常運作。
   原因：現在申請 reCAPTCHA 只剩 Enterprise，要掛 GCP 帳單帳戶，會讓這個 Firebase 專案
   從「Spark 免費方案（超額只會擋請求，不會收費）」變成「Blaze 隨用隨付（超額真的會收費）」，
   對朋友聚會用的小專案來說代價大於實際被打爆配額的機率，所以先不做。 */
var appCheckSiteKey = "YOUR_RECAPTCHA_SITE_KEY";

/* ============ 角色登錄表 ============ */
var ROLES = {
  villager:{id:'villager',name:'平民',faction:'good_villager',night:false,desc:'無特殊能力。'},
  wolf:{id:'wolf',name:'狼人',faction:'wolf',night:true,nightGroup:'wolf',desc:'每晚與其他狼人共同睜眼，選擇一位玩家殺害。'},
  wolfking:{id:'wolfking',name:'狼王',faction:'wolf',night:true,nightGroup:'wolf',deathTrigger:true,desc:'與狼人一同睜眼行動；死亡時可開槍帶走一位玩家。'},
  whitewolfking:{id:'whitewolfking',name:'白狼王',faction:'wolf',night:true,nightGroup:'wolf',deathTrigger:true,dayDetonate:true,desc:'與狼人一同睜眼行動；白天可自爆並開槍帶走一位玩家，自爆後立即進入夜晚。'},
  wolfbeauty:{id:'wolfbeauty',name:'狼美人',faction:'wolf',night:true,nightGroup:'wolfbeauty',desc:'每晚魅惑一位玩家；狼美人死亡時，被魅惑者同歸於盡。'},
  seer:{id:'seer',name:'預言家',faction:'good_god',night:true,nightGroup:'seer',desc:'每晚查驗一位玩家的陣營（好人／狼人）。'},
  witch:{id:'witch',name:'女巫',faction:'good_god',night:true,nightGroup:'witch',desc:'持有解藥、毒藥各一瓶，可救人或毒人，皆限用一次。'},
  hunter:{id:'hunter',name:'獵人',faction:'good_god',night:false,deathTrigger:true,desc:'死亡時可開槍帶走一位玩家（若中毒身亡則依規則可能無法開槍）。'},
  guard:{id:'guard',name:'守衛',faction:'good_god',night:true,nightGroup:'guard',desc:'每晚守護一位玩家免於狼人攻擊；不可連續兩晚守同一人。'},
  idiot:{id:'idiot',name:'白痴',faction:'good_god',night:false,voteImmunity:true,desc:'被投票放逐時翻牌免死，但永久失去投票權。'},
  knight:{id:'knight',name:'騎士',faction:'good_god',night:false,duel:true,desc:'白天可指定一人決鬥：猜中狼人則對方死，猜錯則騎士死；每局限一次。'}
};
var ROLE_LIST=['villager','wolf','wolfking','whitewolfking','wolfbeauty','seer','witch','hunter','guard','idiot','knight'];
var FACTION_LABEL={wolf:'狼人陣營',good_god:'好人陣營・神職',good_villager:'好人陣營・平民'};
var FACTION_BADGE={wolf:'badge-wolf',good_god:'badge-good',good_villager:'badge-muted'};
// 座位管理標記身份後依角色分色（使用者指定：守衛藍天藍／女巫鮮紅／預言家桃紫／獵人亮黃／
// 平民較暗的黃／狼人陣營全部深紅——狼人/狼王/白狼王/狼美人共用同一個顏色，不分開)。
// 其餘角色（白痴/騎士）還沒指定顏色，先不列在這裡，維持原本的綠色 .tagged。
var ROLE_SEAT_COLOR_CLASS={guard:'role-guard',witch:'role-witch',seer:'role-seer',hunter:'role-hunter',
  wolf:'role-wolf',wolfking:'role-wolf',whitewolfking:'role-wolf',wolfbeauty:'role-wolf',villager:'role-villager'};

function nightGroupOrder(rc){
  // 特殊狼（狼王/白狼王/狼美人）如果在場，先在「wolfspecial」這一步把身份標記清楚，
  // 標記完才輪到「wolf」這一步——這一步只單獨標記普通狼人，然後才是全體狼人陣營
  // 共同決定殺人目標。狼美人跟狼人一起睜眼決定殺人目標後，狼人陣營先閉眼，
  // 換狼美人單獨睜眼選魅惑對象，所以她的「行動」還是排在自己獨立的一步，緊接在「狼人」之後，
  // 只有「標記身份」的部分提前到 wolfspecial。
  var wolfBlock = ['wolfspecial','wolf','wolfbeauty'];
  var front = rc.guardBeforeWolf!==false ? ['guard'].concat(wolfBlock) : wolfBlock.concat(['guard']);
  // 獵人需要知道當晚（狼刀/守衛/女巫）的結果才能告知能不能開槍，所以排在女巫之後；
  // 預言家一律排在最後才睜眼（不受此規則開關影響）。
  var mid = rc.witchBeforeSeer!==false ? ['witch','hunter'] : ['hunter','witch'];
  return front.concat(mid).concat(['seer']);
}
var NIGHT_GROUP_LABEL={guard:'守衛',wolfspecial:'特殊狼',wolf:'狼人',wolfbeauty:'狼美人',witch:'女巫',seer:'預言家',hunter:'獵人'};
/* 特殊狼那一步不要用「特殊狼」代稱帶過，要直接顯示本局實際配置的是哪幾種特殊狼（狼王/白狼王/狼美人）。 */
function nightGroupLabel(g){
  if(g==='wolfspecial'){
    var names=['wolfking','whitewolfking','wolfbeauty'].filter(function(r){return (roleConfigCounts()[r]||0)>0;}).map(function(r){return ROLES[r].name;});
    return names.length ? names.join('/') : '特殊狼';
  }
  return NIGHT_GROUP_LABEL[g];
}

/* ============ DB init（Firebase，匿名連線，玩家全程不用登入）============ */
async function boot(){
  try{
    if(!firebaseConfig.apiKey || firebaseConfig.apiKey==='YOUR_API_KEY'){ dbStatus='unavailable'; render(); return; }
    firebase.initializeApp(firebaseConfig);
    if(appCheckSiteKey && appCheckSiteKey!=='YOUR_RECAPTCHA_SITE_KEY'){
      try{ firebase.appCheck().activate(appCheckSiteKey, true); }
      catch(e){ /* App Check 設定有誤也不要卡住整個 App 啟動 */ }
    }
    await firebase.auth().signInAnonymously();
    db = firebase.firestore();
  }catch(e){ db=null; dbStatus='unavailable'; render(); return; }
  if(!db){ dbStatus='unavailable'; render(); return; }
  dbStatus='ok';
  db.doc('game/state').onSnapshot(function(s){ state.game=s.exists?s.data():null; render(); }, function(){ dbStatus='unavailable'; render(); });
  db.collection('seats').onSnapshot(function(qs){ var m={}; qs.docs.forEach(function(d){m[d.id]=d.data();}); state.seats=m; render(); });
  db.collection('roles').onSnapshot(function(qs){ var m={}; qs.docs.forEach(function(d){m[d.id]=d.data();}); state.roles=m; render(); });
  db.collection('nightlog').onSnapshot(function(qs){ var m={}; qs.docs.forEach(function(d){m[d.id]=d.data();}); state.nightlog=m; render(); });
  db.collection('votes').onSnapshot(function(qs){ var m={}; qs.docs.forEach(function(d){m[d.id]=d.data();}); state.votes=m; render(); });
  db.doc('pure/state').onSnapshot(function(s){ state.pure=s.exists?s.data():null; render(); });
  db.collection('pureSeats').onSnapshot(function(qs){ var m={}; qs.docs.forEach(function(d){m[d.id]=d.data();}); state.pureSeats=m; render(); });
  db.collection('pureVotes').onSnapshot(function(qs){ var m={}; qs.docs.forEach(function(d){m[d.id]=d.data();}); state.pureVotes=m; render(); });
  render();
}
boot();

/* ============ 小工具 ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function seatNums(){ var n=(state.game&&state.game.totalSeats)||0; var a=[]; for(var i=1;i<=n;i++)a.push(i); return a; }
function seatData(n){ return state.seats[String(n)] || {seatNumber:n,occupied:false,alive:true}; }
function aliveSeatList(){ return seatNums().filter(function(n){ return seatData(n).alive; }); }
function roleOfSeat(n){ var r=state.roles[String(n)]; return r?r.role:null; }
function roleAbilities(n){ var r=state.roles[String(n)]; return (r&&r.abilities)||{}; }
function findSeatsWithRole(roleId){ return seatNums().filter(function(n){return roleOfSeat(n)===roleId;}); }
function findAliveSeatWithRole(roleId){ return findSeatsWithRole(roleId).find(function(n){return seatData(n).alive;}); }
function nowIso(){ return new Date().toISOString(); }
function fmtWeight(w){ return (Math.round(w*10)/10).toFixed(w%1?1:0); }

function rc(){ return (state.game&&state.game.ruleConfig)||{}; }
function roleConfigCounts(){ return (state.game&&state.game.roleConfig)||{}; }

async function updateGame(patch){ await db.doc('game/state').update(patch); }
async function setGame(obj){ await db.doc('game/state').set(obj); }
async function updateSeat(n,patch){ await db.collection('seats').doc(String(n)).update(patch).catch(function(){ db.collection('seats').doc(String(n)).set(Object.assign({seatNumber:n,occupied:false,alive:true},patch)); }); }
async function setSeat(n,obj){ await db.collection('seats').doc(String(n)).set(obj); }
async function updateRole(n,patch){
  var ref=db.collection('roles').doc(String(n));
  var cur=state.roles[String(n)];
  if(cur){ await ref.update(patch); } else { await ref.set(Object.assign({seatNumber:n,role:null,abilities:{}},patch)); }
}
function claimSeat(collectionPath, seatId, data){
  var ref = db.collection(collectionPath).doc(String(seatId));
  return db.runTransaction(function(tx){
    return tx.get(ref).then(function(snap){
      if(snap.exists && snap.data().occupied){ return {claimed:false}; }
      tx.set(ref, data);
      return {claimed:true};
    });
  });
}
async function appendLog(text){
  var log=(state.game&&state.game.log)||[];
  log=log.concat([{t:nowIso(),text:text}]);
  if(log.length>200) log=log.slice(log.length-200);
  await updateGame({log:log});
}

function toggleSwitch(key,on){ return '<span class="switch'+(on?' on':'')+'" data-act="toggle" data-key="'+key+'"></span>'; }
function rangeArr(a,b){ var r=[]; for(var i=a;i<=b;i++)r.push(i); return r; }
function seatPickButtons(list,act,selected,extraData){

function renderPureVoteView(isGod){
  var vid = pureLatestVoteId();
  if(!vid || !state.pureVotes[vid]){
    return '<div class="card"><p class="muted">目前沒有進行中的投票。</p></div>';
  }
  var v = state.pureVotes[vid];
  var eligible = rangeArr(1,pureTotalSeats()).filter(function(n){return pureSeatData(n).occupied;});
  var html='<div class="card stack"><div class="row between"><h2>'+esc(v.label||'投票')+'</h2>'+(v.open?'<span class="badge badge-good">進行中</span>':'<span class="badge badge-muted">已結束</span>')+'</div>';
  if(isGod && v.sheriffSeat!=null){
    html += '<label class="toggle-row"><span><span class="t-label">警長歸票（算 1.5 票）</span><br><span class="t-desc">警長（'+v.sheriffSeat+'號）口頭宣告投給誰後再勾選</span></span>'+toggleSwitch('sheriffDeclare:'+v.id, v.sheriffDeclared)+'</label>';
  }
  if(v.open && !isGod && ui.pureSeat!=null){
    html += '<div class="btngrid">' + eligible.map(function(n){
        var mine = v.choices && v.choices[ui.pureSeat]===n;
        return '<button class="btn btn-sm'+(mine?' btn-wolf':'')+'" data-act="pure-vote" data-target="'+n+'">'+n+'</button>';
      }).join('')
      + '<button class="btn btn-sm'+(v.choices&&v.choices[ui.pureSeat]===0?' btn-wolf':'')+'" data-act="pure-vote" data-target="0">棄票</button>'
      + '</div>';
  }
  // 跟完整模式一樣：投票過程中只有計票員看得到明細，玩家要等投票結束才看得到。
  if(isGod || !v.open){
    html += renderVoteBreakdown(v);
  } else {
    html += '<p class="small muted" style="margin-top:4px;">投票結果會在投票結束後公布，請耐心等候。</p>';
  }
  if(v.open && ui.pureSeat!=null){
    var mineChoice = v.choices && v.choices[ui.pureSeat];
    html += '<p class="small muted">你目前是 '+ui.pureSeat+' 號座位'+(mineChoice!=null?(mineChoice===0?'，已選擇棄票':'，已投給 '+mineChoice+' 號'):'，尚未投票')+'。</p>';
  }
  if(isGod && v.open){
    html += '<button class="btn btn-wolf btn-block" data-act="pure-close-vote">投票結束</button>';
  }
  html += '</div>';
  return html;
}
function tallyOf(v){
  var t={}; var choices=v.choices||{};
  Object.keys(choices).forEach(function(seat){
    var target=choices[seat];
    var w = (v.sheriffSeat!=null && Number(seat)===Number(v.sheriffSeat) && v.sheriffDeclared) ? 1.5 : 1;
    t[target]=(t[target]||0)+w;
  });
  return t;
}

/* 座位管理裡「標記身份」永遠列出本局所有有配置名額的角色，不管名額是不是已經滿了——
   名額滿了也一樣可以選，選下去會自動把身份從原本持有的座位搬過來（見 set-seat-role 的處理），
   這樣才能真的「換身份」，不會因為名額已滿就卡住只剩目前這個角色可選。 */
function roleOptionsFor(currentRole){

}
function renderGodBottomTools(){
  // 保底觸發點：不管是靠夜晚流程自動跑完、還是上帝全程用座位管理手動標記身份，
  // 只要已經確定不會再有正常管道標記角色了（白天，或夜晚睜眼流程已經跑完），
  // 就把還沒身份的已入座座位自動填平民，不用再靠使用者剛好走到那個畫面才觸發。
  if(state.game.phase==='day' || (state.game.phase==='night' && (state.game.nightStepIndex||0) >= activeNightGroups().length)){
    autoFillVillagers();
  }
  var assignedByRole={}; seatNums().forEach(function(n){ var r=roleOfSeat(n); if(r) assignedByRole[r]=(assignedByRole[r]||0)+1; });
  var remaining = ROLE_LIST.filter(function(r){ return (roleConfigCounts()[r]||0) > (assignedByRole[r]||0); });

  if(remaining.length){
    html += '<p class="small muted">還沒標記完的角色：'+remaining.map(function(r){return ROLES[r].name+'('+(assignedByRole[r]||0)+'/'+roleConfigCounts()[r]+')';}).join('、')+'</p>';
  }
  html += '<p class="small muted">每一個座位都可以點選，跳出視窗可以標記/修改身份、改暱稱、標記存活死亡或清空座位——已經標記身份的座位會依角色分色（守衛藍天藍／女巫鮮紅／預言家桃紫／獵人亮黃／狼人陣營深紅／平民較暗的黃，其餘角色暫時維持綠色），一眼就能看出誰還沒登記；當選警長的座位會有小皇冠標示。</p>';
  html += '<div class="seat-grid">' + seatNums().map(function(n){
    var s=seatData(n); var role=roleOfSeat(n);
    var tagged = !!role; // 不看 occupied：不開手機也可能已經被標記身份（例如自動填平民）
    var roleColorClass = role && ROLE_SEAT_COLOR_CLASS[role] ? (' '+ROLE_SEAT_COLOR_CLASS[role]) : '';
    var cls='seat'+(!s.occupied?' empty':'')+(s.occupied&&!s.alive?' dead':'')+(tagged?' tagged':'')+roleColorClass+(state.game.sheriffSeat===n?' sheriff':'');
    var roleTag = role ? ('<div class="small" style="margin-top:2px;">'+ROLES[role].name+'</div>') : '<div class="small muted" style="margin-top:2px;">未標記</div>';
    return '<div class="'+cls+'" data-act="pick-role-for-seat" data-n="'+n+'">'
      + '<div class="num mono">'+n+'</div><div class="nick">'+(s.occupied?esc(s.nickname||'已入座'):'空位')+'</div>'+roleTag+'</div>';
  }).join('') + '</div>';
  html += '<button class="btn btn-ghost btn-block" data-act="reset-game" style="margin-top:6px;" data-confirm="確定要重置整局嗎？所有座位、角色、投票紀錄都會清空。">重置整局</button>';
  html += '</div>';
  html += '<div class="card stack"><h2>上帝紀錄簿（僅上帝看得到）</h2>' + renderGodOnlyLog() + '</div>';

/* 點座位跳出的「座位管理」彈出視窗：取代原本條列+下拉選單的做法，改成點按鈕，
   同一頁也能直接改暱稱、標記存活/死亡、或清空整個座位；空位則改顯示手動入座的表單。 */
/* 不管這個座位有沒有開手機入座（occupied），一律顯示完整的管理畫面——改暱稱、標記/換身份、

function renderPickRoleForSeat(n){

        : '<p class="muted small">這個座位還沒有人開手機入座，上帝可以直接在這裡代為標記；標記身份或改暱稱後會自動視為已入座。目前身份：'+(role?ROLES[role].name:'未標記')+'</p>')
    + '<div class="field"><label>暱稱</label><div class="row"><input type="text" id="editSeatNick" value="'+esc(s.nickname||'')+'" placeholder="暱稱" style="flex:1;"><button class="btn btn-sm" data-act="update-seat-nick" data-n="'+n+'">更新</button></div></div>'
    + '<div class="eyebrow" style="margin-top:4px;">標記身份</div>'
    + '<div class="btngrid">'
    + options.map(function(r){return '<button class="btn btn-sm'+(role===r?' btn-wolf':'')+'" data-act="set-seat-role" data-n="'+n+'" data-r="'+r+'">'+ROLES[r].name+'</button>';}).join('')
    + '</div>'
    + '<button class="btn btn-ghost btn-block" style="margin-top:8px;" data-act="set-seat-role" data-n="'+n+'" data-r="">清除身份標記（改回未標記）</button>'
    + '<button class="btn '+(s.alive?'btn-wolf':'btn-good')+' btn-block" style="margin-top:8px;" data-act="toggle-alive" data-n="'+n+'">標記為'+(s.alive?'已死亡':'存活')+'</button>'

    + '<button class="btn btn-ghost btn-block" style="margin-top:8px;" data-act="close-pick-role">取消，返回</button>'
    + '</div>';
  return html;
}
function renderGodOnlyLog(){
  var items=[];
  Object.keys(state.nightlog).sort().forEach(function(k){
    var nl=state.nightlog[k];
    items.push('【'+k+'】守='+(nl.guardTarget||'-')+' 狼刀='+(nl.wolfTarget||'-')+' 女巫解='+(nl.antidoteTarget||'-')+' 女巫毒='+(nl.poisonTarget||'-')+' 預言='+(nl.seerTarget?nl.seerTarget+'→'+nl.seerResult:'-'));
  });
  if(!items.length) return '<p class="muted small">尚無紀錄。</p>';
  return '<div class="log">'+items.map(function(t){return '<div class="log-item">'+esc(t)+'</div>';}).join('')+'</div>';
}

/* ---- 夜晚引擎 ---- */
function currentNightlogKey(){ return 'night-'+state.game.nightNumber; }
function currentNightlog(){ return state.nightlog[currentNightlogKey()] || {}; }
async function ensureNightlog(){
  var key=currentNightlogKey();
  if(!state.nightlog[key]){ await db.collection('nightlog').doc(key).set({night:state.game.nightNumber}); }
}
function activeNightGroups(){ return nightGroupOrder(rc()).filter(groupExistsInConfig); }

function roleMaybeAlive(r){
  var need = roleConfigCounts()[r]||0;
  if(need<=0) return false;
  var assigned = findSeatsWithRole(r);
  if(assigned.length < need) return true; // 還沒標記完，先當作可能存活，讓上帝有機會標記
  return assigned.some(function(n){ return seatData(n).alive; });
}
function groupHasAliveRole(group){
  if(group==='guard') return roleMaybeAlive('guard');
  if(group==='witch') return roleMaybeAlive('witch');
  if(group==='seer') return roleMaybeAlive('seer');
  if(group==='hunter') return roleMaybeAlive('hunter');
  if(group==='wolfbeauty') return roleMaybeAlive('wolfbeauty');
  if(group==='wolfspecial') return ['wolfking','whitewolfking','wolfbeauty'].some(roleMaybeAlive);
  if(group==='wolf') return ['wolf','wolfking','whitewolfking'].some(roleMaybeAlive);
  return false;
}
function groupExistsInConfig(group){
  if(group==='guard') return (roleConfigCounts().guard||0)>0;
  if(group==='witch') return (roleConfigCounts().witch||0)>0;
  if(group==='seer') return (roleConfigCounts().seer||0)>0;
  if(group==='hunter') return (roleConfigCounts().hunter||0)>0;
  if(group==='wolfbeauty') return (roleConfigCounts().wolfbeauty||0)>0;
  if(group==='wolfspecial') return ['wolfking','whitewolfking','wolfbeauty'].some(function(r){return (roleConfigCounts()[r]||0)>0;});
  if(group==='wolf') return ['wolf','wolfking','whitewolfking'].some(function(r){return (roleConfigCounts()[r]||0)>0;});
  return false;
}

/* 所有會睜眼的角色都標記完之後，剩下還沒標記身份的座位直接自動標記成平民——
   不能只看 occupied（有沒有開手機入座），因為這個 App 本來就設計成玩家不開手機也能玩、
   上帝口頭代為操作，很多座位一輩子 occupied 都是 false，只看 occupied 會導致這個座位
   永遠不會被自動填平民。只要座位號碼在本局總人數範圍內，就當作是真的玩家。
   白痴/騎士不在夜晚睜眼流程裡，如果本局有這兩個角色、又還沒死亡/自報身份，座位會先被
   標成平民，等他們死亡或自己跳出來時，上帝要記得到「座位管理」把身份改回白痴/騎士，
   不然白痴免死、騎士決鬥這些判定會抓不到人。 */
function autoFillVillagers(){
  seatNums().forEach(function(n){
    if(!roleOfSeat(n)){ updateRole(n,{role:'villager'}); }
  });
}
function renderNightEngine(){
  ensureNightlog();
  var groups=activeNightGroups();
  var idx=state.game.nightStepIndex||0;
  var html='<div class="card stack"><h2>🌙 第 '+state.game.nightNumber+' 夜 導讀</h2>';
  html += '<div class="stack">' + groups.map(function(g,i){
    var status = i<idx?'done':(i===idx?'active':'');
    return '<div class="step '+status+'">'+(i+1)+'. '+nightGroupLabel(g)+' 睜眼'+(status==='done'?' ✓':'')+'</div>';
  }).join('') + '</div></div>';

  var backBtn = idx>0 ? '<button class="btn btn-ghost btn-block" data-act="night-back" data-confirm="確定要回到上一位角色重新處理嗎？上一位角色這一晚做的選擇會被清空，可以重新選一次。">← 上一步（回到上一位角色重新處理）</button>' : '';

  if(idx>=groups.length){
    autoFillVillagers();
    var willCallSheriff = (state.game.dayNumber||0)===0 && rc().sheriffEnabled;
    html += '<div class="card stack"><h2>'+(willCallSheriff?'天亮了，現在開始競選警長，請要競選警長的玩家起立':'夜晚結束')+'</h2><p class="muted">'
      + (willCallSheriff ? '登記完參選名單才會正式公布昨晚的死訊。' : '所有睜眼流程已完成，可以天亮公布死訊。')
      + '</p><button class="btn btn-primary btn-block" data-act="resolve-night">'
      + (willCallSheriff ? '競選警長' : '天亮了，公布結果')
      + '</button></div>'
      + backBtn;
    return html;
  }
  var group=groups[idx];
  if(!groupExistsInConfig(group)){
    html += '<div class="card stack"><h2>本局沒有「'+nightGroupLabel(group)+'」角色</h2><p class="muted small">直接略過這一步，不用喊名。</p>'
      + '<button class="btn btn-primary btn-block" data-act="night-skip" style="margin-top:10px;">下一步</button></div>'
      + backBtn;
    return html;
  }
  if(!groupHasAliveRole(group)){
    // 這個角色其實已經沒有存活者了，但每一夜的導讀台詞都要跟角色還活著時一模一樣，
    // 不能因為沒人可以睜眼就換一種講法或直接跳過不喊——這樣才不會讓其他閉眼的玩家從
    // 上帝喊名的節奏/內容變化，推測出這個角色已經死亡。上帝內部操作上直接按下一步即可。
    html += '<div class="card stack"><h2>請'+nightGroupLabel(group)+'睜眼</h2>'
      + '<p class="muted small">（稍等一下，不用等待任何回應）接著照樣說：「請'+nightGroupLabel(group)+'閉眼」。上帝內部備註：此角色已無存活者，操作上直接按下一步即可，不用等待、不用比手勢。</p>'
      + '<button class="btn btn-primary btn-block" data-act="night-skip" style="margin-top:10px;">下一步</button></div>'
      + backBtn;
    return html;
  }
  // 這一步的身份如果已經標記完成、正要顯示動作畫面，把外層「上一步」換成「重新標記身份」，
  // 讓上帝可以回頭修正標錯的座位（例如把狼王誤點成別的座位）；只在第一夜這樣做——
  // 從第二夜開始身份早就確定了，「上一步」該做的事還是回到上一位角色、清掉這一晚的選擇。
  var identifyRoles = groupIdentifyRoles(group);
  if(identifyRoles.length && state.game.nightNumber===1){
    var stillNeedsIdentify = identifyRoles.some(function(r){ return findSeatsWithRole(r).length < (roleConfigCounts()[r]||0); });
    if(!stillNeedsIdentify){
      backBtn = '<button class="btn btn-ghost btn-block" data-act="undo-identify" data-group="'+group+'" data-confirm="確定要清除「'+nightGroupLabel(group)+'」這一步標記的身份，回去重新標記嗎？">← 上一步（重新標記身份）</button>';
    }
  }
  if(group==='witch'){
    var witchNl=currentNightlog();
    var witchStage1Done = !!witchNl.antidoteDeclined || !!witchNl.antidoteTarget;
    if(witchStage1Done){ backBtn=''; } // 階段二有自己的「上一步」按鈕，不能再用這顆跳去上一位角色
  }
  if(group==='seer'){
    var seerNl=currentNightlog();
    if(seerNl.seerTarget || seerNl.seerPendingTarget){ backBtn=''; } // 預言家自己選完/待補身份後也有專屬的「上一步」，不能再用這顆跳去上一位角色
  }
  html += renderNightGroupAction(group) + backBtn;
  return html;
}
function groupIdentifyRoles(group){
  if(group==='guard') return ['guard'];
  if(group==='wolfspecial') return ['wolfking','whitewolfking','wolfbeauty'].filter(function(r){return (roleConfigCounts()[r]||0)>0;});
  if(group==='wolf') return ['wolf'];
  if(group==='wolfbeauty') return ['wolfbeauty'];
  if(group==='witch') return ['witch'];
  if(group==='seer') return ['seer'];
  if(group==='hunter') return ['hunter'];
  return [];
}
async function actUndoIdentify(group){
  var roles = groupIdentifyRoles(group);
  var jobs = [];
  roles.forEach(function(r){
    findSeatsWithRole(r).forEach(function(n){ jobs.push(updateRole(n,{role:null})); });
  });
  await Promise.all(jobs);
}

/* 首次遇到「守衛/女巫/預言家/狼美人」這種一睜眼就會暴露身份的角色時，
   請上帝就地標記是哪個座位——這對應現實中「上帝親眼看到誰睜眼」那一刻。
   h2 放的是這個角色平常會唸出口的導讀台詞（跟後面動作畫面共用同一句），
   「標記身份：XX」這種上帝內部操作備註移到下面 muted 小字，維持「唸白 vs 操作說明」一致的格式。 */
function pickIdentifyUI(roleId, wakeLine){
  var have = findSeatsWithRole(roleId).length;
  var need = roleConfigCounts()[roleId]||0;
  if(have>=need) return null;
  var candidates = aliveSeatList().filter(function(n){ return !roleOfSeat(n); });
  // 不加二次確認：點錯了可以直接到下面「座位管理」點開那個座位重新標記，不用每標記一個人就多按一次確認。
  return '<div class="card stack"><h2>'+wakeLine+'</h2><p class="muted small">標記身份：'+ROLES[roleId].name+'——請看誰睜眼／示意，點出是哪一位座位。</p>'
    + '<div class="btngrid">'+candidates.map(function(n){return '<button class="btn btn-sm" data-act="assign-role-quick" data-r="'+roleId+'" data-n="'+n+'">'+n+'</button>';}).join('')+'</div></div>';
}
// 特殊狼每一種都有自己不一樣的導讀（不是共用一句），標記身份當下只是單純起立示意，
// 還不涉及選誰、所以不用像「狼人」那樣接「今晚要擊殺的對象是...」。
var WOLF_SPECIAL_WAKE_LINE = {
  wolfking: '狼王現身請睜眼',
  whitewolfking: '白狼王現身請睜眼',
  wolfbeauty: '狼美人現身請睜眼'
};
function renderNightGroupAction(group){
  var alive = aliveSeatList();
  if(group==='guard'){
    var pick=pickIdentifyUI('guard','守衛請睜眼，今晚你要守護的對象是...');
    if(pick) return pick;
    var seat=findAliveSeatWithRole('guard');
    var last=roleAbilities(seat).guardLastTarget;
    var options = alive.filter(function(n){ return n!==last; });
    return '<div class="card stack"><h2>守衛請睜眼，今晚你要守護的對象是...</h2><p class="muted small">守衛（'+seat+'號）選擇今晚守護的對象，不能與昨晚相同（'+(last||'無')+'）。</p>'
      + '<div class="btngrid">' + options.map(function(n){return '<button class="btn btn-sm" data-act="night-guard" data-n="'+n+'" data-confirm="確定守衛守護 '+n+' 號嗎？">'+n+'</button>';}).join('') + '</div>'
      + '<button class="btn btn-ghost btn-block" data-act="night-guard" data-n="0">今晚不守護任何人</button></div>';
  }
  if(group==='wolfspecial'){
    // 特殊狼（狼王/白狼王/狼美人）如果在場，先在這一步逐一標記清楚是哪幾個座位，
    // 標記完才輪到「狼人」這一步；沿用跟守衛/女巫一樣的 pickIdentifyUI。
    var specialRoles = ['wolfking','whitewolfking','wolfbeauty'].filter(function(r){ return (roleConfigCounts()[r]||0)>0; });
    for(var si=0; si<specialRoles.length; si++){
      var pickS = pickIdentifyUI(specialRoles[si], WOLF_SPECIAL_WAKE_LINE[specialRoles[si]]);
      if(pickS) return pickS;
    }
    return '<div class="card stack"><h2>特殊狼身份已確認</h2>'
      + '<p class="muted small">本局的'+specialRoles.map(function(r){return ROLES[r].name;}).join('、')+'身份都已標記完成，接著請狼人一起睜眼。</p>'
      + '<button class="btn btn-primary btn-block" data-act="night-skip" style="margin-top:10px;">下一步</button></div>';
  }
  if(group==='wolf'){
    // 普通狼人睜眼時標記清楚是哪幾個座位（狼王/白狼王已經在「特殊狼」那一步標記過了）。
    // 因為通常是好幾隻狼一起現身，改成跟上警登記一樣「複選再一起確認」，不用一個一個點。
    var wolfNeed = roleConfigCounts().wolf||0;
    var wolfHave = findSeatsWithRole('wolf').length;
    if(wolfHave < wolfNeed){
      var picked = ui.wolfIdentifyPicked||[];
      var wolfCandidates = aliveSeatList().filter(function(n){ return !roleOfSeat(n); });
      var stillNeed = wolfNeed - wolfHave;
      return '<div class="card stack"><h2>狼人現身請睜眼，今晚要擊殺的對象是...</h2>'
        + '<p class="muted small">標記身份：狼人——點選所有狼人的座位（可複選，還差 '+stillNeed+' 位），選完按下方確認。</p>'
        + '<div class="btngrid">'+wolfCandidates.map(function(n){return '<button class="btn btn-sm'+(picked.indexOf(n)>=0?' btn-wolf':'')+'" data-act="toggle-wolf-identify" data-n="'+n+'">'+n+'</button>';}).join('')+'</div>'
        + '<button class="btn btn-primary btn-block" style="margin-top:10px;" data-act="confirm-wolf-identify" '+(picked.length!==stillNeed?'disabled':'')+'>標記完成（已選 '+picked.length+' / '+stillNeed+'）</button>'
        + '</div>';
    }
    var wolfVariants = ['wolfking','whitewolfking'].filter(function(r){ return (roleConfigCounts()[r]||0)>0; });
    var variantNote = wolfVariants.length ? ('本局狼人陣營還包含：'+wolfVariants.map(function(r){return ROLES[r].name;}).join('、')+'，能力是死亡/白天才觸發，等時機到了系統會提示。') : '';
    return '<div class="card stack"><h2>狼人現身請睜眼，今晚要擊殺的對象是...</h2>'
      + (variantNote?'<p class="small muted">'+variantNote+'</p>':'')
      + '<div class="btngrid">' + alive.map(function(n){return '<button class="btn btn-sm" data-act="night-wolf" data-n="'+n+'" data-confirm="確定狼人今晚殺 '+n+' 號嗎？">'+n+'</button>';}).join('') + '</div>'
      + '<button class="btn btn-ghost btn-block" data-act="night-wolf" data-n="0">今晚空刀</button></div>';
  }
  if(group==='wolfbeauty'){
    var pickB=pickIdentifyUI('wolfbeauty','狼美人請睜眼，今晚你要魅惑的對象是...');
    if(pickB) return pickB;
    var beautySeat=findAliveSeatWithRole('wolfbeauty');
    return '<div class="card stack"><h2>狼美人請睜眼，今晚你要魅惑的對象是...</h2><p class="muted small">狼美人（'+beautySeat+'號）選擇今晚魅惑對象（其他狼人已經閉眼，這是她自己單獨的選擇）。</p>'
      + '<div class="btngrid">' + alive.filter(function(n){return n!==beautySeat;}).map(function(n){return '<button class="btn btn-sm" data-act="night-charm" data-n="'+n+'" data-confirm="確定狼美人魅惑 '+n+' 號嗎？">'+n+'</button>';}).join('') + '</div>'
      + '<button class="btn btn-ghost btn-block" data-act="night-charm" data-n="0">今晚不魅惑</button></div>';
  }
  if(group==='witch'){
    // 不管解藥/毒藥還有沒有，每晚都要走「階段一→階段二」同樣的兩步節奏，
    // 差別只在按鈕內容，藥用完了也要照樣點一次「知道了，繼續」──
    // 這樣上帝每晚花在女巫身上的步驟數/停留時間都一樣，閉眼的其他玩家才不會從節奏猜出解藥還在不在。
    var pick=pickIdentifyUI('witch','女巫請睜眼，今晚他被殺死了，你要使用解藥嗎?你要使用毒藥嗎?');
    if(pick) return pick;
    var wseat=findAliveSeatWithRole('witch');
    var ab=roleAbilities(wseat);
    var nl=currentNightlog();
    var deathSeat = nl.wolfTarget || 0;
    var selfSaveOk = deathSeat!==wseat || (rc().witchSelfSaveFirstNight && state.game.nightNumber===1);
    var html='<div class="card stack"><h2>女巫請睜眼，今晚他被殺死了，你要使用解藥嗎?你要使用毒藥嗎?</h2>'
      + '<p class="muted small">今晚死訊：'+(deathSeat?deathSeat+' 號被攻擊':'無人被攻擊')+'。</p>';

    var antidoteStageDone = !!nl.antidoteDeclined || !!nl.antidoteTarget;
    if(!antidoteStageDone){
      html += '<div class="eyebrow">階段一・解藥</div>';
      if(ab.antidoteUsed){
        html += '<p class="small muted">解藥已經用完了。</p><button class="btn btn-primary btn-block" data-act="night-witch-nosave">知道了，繼續</button>';
      } else if(deathSeat===0){
        html += '<p class="small muted">今晚沒有人受到攻擊，沒有目標可以救。</p><button class="btn btn-primary btn-block" data-act="night-witch-nosave">知道了，繼續</button>';
      } else if(!selfSaveOk){
        html += '<p class="small muted">被攻擊的是女巫自己，依規則本局不可自救。</p><button class="btn btn-primary btn-block" data-act="night-witch-nosave">知道了，繼續</button>';
      } else {
        html += '<div class="row wrap">'
          + '<button class="btn" data-act="night-witch-save" data-n="'+deathSeat+'">使用解藥救 '+deathSeat+' 號</button>'
          + '<button class="btn" data-act="night-witch-nosave">不使用解藥</button></div>';
      }
      html += '</div>';
      return html;
    }

    var poisonBlockedBySameNight = !!nl.antidoteTarget && !rc().witchBothPotionsSameNight;
    var poisonStageDone = !!nl.poisonDeclined || !!nl.poisonTarget;
    if(!poisonStageDone){
      html += '<div class="eyebrow">階段二・毒藥</div>';
      if(ab.poisonUsed){
        html += '<p class="small muted">毒藥已經用完了。</p><button class="btn btn-primary btn-block" data-act="night-witch-nopoison">知道了，繼續</button>';
      } else if(poisonBlockedBySameNight){
        html += '<p class="small muted">今晚已使用解藥，依規則不能同時使用毒藥。</p><button class="btn btn-primary btn-block" data-act="night-witch-nopoison">知道了，繼續</button>';
      } else {
        html += '<div class="field"><label>使用毒藥（可略過）</label><div class="btngrid">'
          + alive.filter(function(n){return n!==wseat;}).map(function(n){return '<button class="btn btn-sm" data-act="night-witch-poison" data-n="'+n+'">'+n+'</button>';}).join('')
          + '</div></div>'
          + '<button class="btn btn-ghost btn-block" data-act="night-witch-nopoison" style="margin-top:8px;">不使用毒藥</button>';
      }
      html += '</div>';
      html += '<button class="btn btn-ghost btn-block" data-act="night-witch-back-antidote" style="margin-top:10px;">← 上一步（回到解藥階段重新選）</button>';
      return html;
    }

    // 解藥、毒藥兩階段都做完了：不用再多問一次「行動結束」，直接進到下一位角色。
    nightAdvance();
    return html + '<p class="small muted">女巫行動已完成，準備進入下一位…</p></div>';
  }
  if(group==='seer'){
    var pick=pickIdentifyUI('seer','預言家請睜眼，你今晚要查驗的對象是...');
    if(pick) return pick;
    var sseat=findAliveSeatWithRole('seer');
    var nl=currentNightlog();
    if(nl.seerTarget){
      return '<div class="card stack"><h2>他的身份是...</h2>'
        + '<p class="muted small">請以手勢告知，正讚為好人、倒讚為狼人。</p>'
        + '<p class="small muted" style="margin-top:6px;">📖 上帝內部參考（不用唸出來）：'+nl.seerTarget+' 號的身份是「'+nl.seerResult+'」。</p>'
        + '<button class="btn btn-primary btn-block" data-act="night-skip" style="margin-top:10px;">下一步</button>'
        + '<button class="btn btn-ghost btn-block" style="margin-top:8px;" data-act="night-seer-back">← 上一步（重新選擇查驗目標）</button></div>';
    }
    if(nl.seerPendingTarget){
      var target=nl.seerPendingTarget;
      var options=remainingRoleOptions();
      return '<div class="card stack"><h2>'+target+' 號的身份還沒登記過</h2><p class="muted small">預言家要查驗這一位，請先確認他實際的身份，系統才能正確告知查驗結果。</p>'
        + '<div class="stack">'+options.map(function(r){return '<button class="btn btn-sm" data-act="assign-seer-target-role" data-n="'+target+'" data-r="'+r+'">'+ROLES[r].name+'</button>';}).join('')+'</div>'
        + '<button class="btn btn-ghost btn-block" style="margin-top:8px;" data-act="night-seer-back">← 上一步（重新選擇查驗目標）</button></div>';
    }
    return '<div class="card stack"><h2>預言家請睜眼，你今晚要查驗的對象是...</h2><p class="muted small">預言家（'+sseat+'號）選擇一位查驗。</p>'
      + '<div class="btngrid">' + alive.filter(function(n){return n!==sseat;}).map(function(n){return '<button class="btn btn-sm" data-act="night-seer" data-n="'+n+'">'+n+'</button>';}).join('') + '</div></div>';
  }
  if(group==='hunter'){
    var pick=pickIdentifyUI('hunter','獵人請睜眼，你今晚的開槍手勢是...');
    if(pick) return pick;
    var hseat=findAliveSeatWithRole('hunter');
    var deaths=computeNightDeaths();
    var dying=deaths.find(function(d){return d.seat===hseat;});
    var canShoot = !(dying && dying.cause==='poison' && !rc().hunterCanShootIfPoisoned);
    return '<div class="card stack"><h2>獵人請睜眼，你今晚的開槍手勢是...</h2>'
      + '<p class="muted small">請以手勢告知，正讚為出局可以開槍、倒讚為不能開槍。</p>'
      + '<p class="small muted" style="margin-top:6px;">📖 上帝內部參考（不用唸出來）：'+(canShoot?'比正讚（可以開槍）。':'比倒讚（今晚中毒身亡，不能開槍）。')+'獵人要到明天上帝公布死訊時才會知道自己是否真的出局。</p>'
      + '<button class="btn btn-primary btn-block" data-act="night-skip" style="margin-top:10px;">下一步</button></div>';
  }
  return '';
}
async function actAssignRoleQuick(seat, roleId){
  await updateRole(seat,{role:roleId});
}

/* ---- 夜晚行動處理 ---- */
async function nightAdvance(){
  var groups=activeNightGroups();
  var idx=(state.game.nightStepIndex||0)+1;
  await updateGame({nightStepIndex:idx});
}
async function actNightGuard(n){
  var seat=findAliveSeatWithRole('guard');
  await ensureNightlog();
  var nl=currentNightlog();
  var patch={guardTarget:n||null};
  // 記下這晚動手前的舊值，「上一步」才能正確復原（不然回去重選會誤判成跟今晚同一人）
  if(nl.guardBaselineTarget===undefined){ patch.guardBaselineTarget = roleAbilities(seat).guardLastTarget||null; }
  await db.collection('nightlog').doc(currentNightlogKey()).update(patch);
  if(n) await updateRole(seat,{abilities:Object.assign({},roleAbilities(seat),{guardLastTarget:n})});
  await nightAdvance();
}
async function actNightBack(){
  var groups=activeNightGroups();
  var idx=state.game.nightStepIndex||0;
  if(idx<=0) return;
  var prevGroup=groups[idx-1];
  var nl=currentNightlog();
  if(prevGroup==='guard'){

    }

  } else if(prevGroup==='wolf'){

    var bseat=findAliveSeatWithRole('wolfbeauty');

  } else if(prevGroup==='witch'){

    await db.collection('nightlog').doc(currentNightlogKey()).update({antidoteTarget:null, poisonTarget:null, antidoteDeclined:null, poisonDeclined:null});
  } else if(prevGroup==='seer'){
    await db.collection('nightlog').doc(currentNightlogKey()).update({seerTarget:null, seerResult:null, seerPendingTarget:null});
  }
  // 獵人、特殊狼（wolfspecial）這兩步純提示/純標記身份、不寫夜間選擇資料，不用清
  await updateGame({nightStepIndex: idx-1});
}

/* ---- 死亡結算引擎（夜晚 & 白天共用）---- */
function computeNightDeaths(){
  var nl=currentNightlog();
  var deaths=[];
  var wolfTarget=nl.wolfTarget||0;
  if(wolfTarget){
    var savedByGuard = nl.guardTarget===wolfTarget;
    var savedByWitch = nl.antidoteTarget===wolfTarget;
    if(savedByGuard && savedByWitch && rc().guardWitchOverlapKills){ deaths.push({seat:wolfTarget,cause:'wolf'}); }
    else if(savedByGuard || savedByWitch){ /* 存活 */ }
    else { deaths.push({seat:wolfTarget,cause:'wolf'}); }
  }
  if(nl.poisonTarget){ deaths.push({seat:nl.poisonTarget,cause:'poison'}); }
  var seen={}; deaths=deaths.filter(function(d){ if(seen[d.seat])return false; seen[d.seat]=true; return true; });
  return deaths;
}
async function resolveNight(){
  var deaths=computeNightDeaths();
  // 第一天不要馬上公布死訊，要先問完上警才正式公布（跟現實流程一致）
  var suppressReveal = (state.game.dayNumber||0)===0;
  await startResolution(deaths,'night',suppressReveal);
}
async function startResolution(deaths,context,suppressReveal,meta){
  await updateGame({ pending:{ queue:deaths, awaiting:null, context:context, resolvedText:[], suppressReveal: !!suppressReveal, meta: meta||null } });
  await processPendingQueue();
}
async function processPendingQueue(){
  var g = state.game; if(!g || !g.pending) return;
  var pending = g.pending;
  if(pending.awaiting) return; // 等待上帝輸入
  var queue = pending.queue.slice();
  if(!queue.length){
    // 結算完成
    var texts = pending.resolvedText||[];
    var context = pending.context;
    var suppress = pending.suppressReveal;
    await updateGame({pending:null});
    var winner=checkWin();
    if(suppress && !winner){
      // 第一天：先不公布死訊，進上警登記（或沒開上警就直接進公布階段）
      await updateGame({
        phase:'day', dayNumber:(state.game.dayNumber||0)+1,
        dayStage: rc().sheriffEnabled ? 'sheriff_call' : 'reveal',
        afterReveal: 'lynch_vote',
        pendingRevealTexts: texts
      });
      return;
    }
    for (var i=0;i<texts.length;i++) await appendLog(texts[i]);
    if(winner){ await updateGame({winner:winner}); return; }
    if(context==='night'){
      await updateGame({phase:'day', dayNumber:(state.game.dayNumber||0)+1, dayStage:'lynch_vote', dayStagePrev:null});
    } else if(context==='day-after-vote'){
      // 放逐投票出局的玩家有遺言，插一段遺言關卡，講完才進下一夜
      var votedSeat = pending.meta && pending.meta.votedSeat;
      if(votedSeat!=null){
        await updateGame({lastWordsQueue:[votedSeat], lastWordsNext:'__advance_night__'});
      } else {
        // nightStepIndex:-1＝「天黑請閉眼」尚未確認，不能直接跳進第一位角色的睜眼畫面
        await updateGame({phase:'night', nightNumber:(state.game.nightNumber||0)+1, nightStepIndex:-1, dayStage:null});
      }
    } else if(context==='detonate'){
      await updateGame({phase:'night', nightNumber:(state.game.nightNumber||0)+1, nightStepIndex:-1, dayStage:null});
    }
    return;
  }
  var d = queue.shift();
  var seatN = d.seat, cause=d.cause;
  var s = seatData(seatN);
  if(!s.alive){ // 已經死了，略過
    await updateGame({pending:Object.assign({},pending,{queue:queue})});
    return processPendingQueue();
  }
  var role = roleOfSeat(seatN);
  var texts = (pending.resolvedText||[]);
  if(!role){
    // 這個座位死亡時身份還沒被標記過（例如平民/獵人/白痴/騎士這種平時不用睜眼的角色）；
    // 先請上帝補標記，才能正確判斷開槍/白痴翻牌/勝負等後續。
    await updateGame({pending:Object.assign({},pending,{queue:queue,resolvedText:texts,awaiting:{seat:seatN,needRole:true,cause:cause}})});
    return;
  }
  if(role==='idiot' && cause==='vote' && !roleAbilities(seatN).idiotRevealed){
    await updateRole(seatN,{abilities:Object.assign({},roleAbilities(seatN),{idiotRevealed:true})});
    await updateSeat(seatN,{loseVoteRights:true});
    texts=texts.concat([seatN+' 號玩家身分公開，免於出局，但永久失去投票權。']);
    await updateGame({pending:Object.assign({},pending,{queue:queue,resolvedText:texts})});
    return processPendingQueue();
  }
  await updateSeat(seatN,{alive:false,deathCause:cause,revealed:!pending.suppressReveal});
  texts=texts.concat([seatN+' 號玩家死亡。']);
  // 狼美人殉情
  var beautySeat = findSeatsWithRole('wolfbeauty')[0];
  if(beautySeat===seatN){
    var charmed = roleAbilities(seatN).charmedSeat;
    if(charmed && seatData(charmed).alive){
      queue.push({seat:charmed,cause:'heartbreak'});
    }
  }
  await updateGame({pending:Object.assign({},pending,{queue:queue,resolvedText:texts})});
  // 警徽轉移：不管警長是怎麼死的（夜晚被殺、中毒、被投票、決鬥…），都要處理
  if(seatN===state.game.sheriffSeat){
    await updateGame({pending:Object.assign({},pending,{queue:queue,resolvedText:texts,awaiting:{seat:seatN,badgeTransfer:true}})});
    return;
  }
  var roleDef = role?ROLES[role]:null;
  if(roleDef && roleDef.deathTrigger){
    var used = roleAbilities(seatN).shotUsed;
    var blockedByPoison = cause==='poison' && ((role==='hunter' && !rc().hunterCanShootIfPoisoned) || ((role==='wolfking'||role==='whitewolfking') && !rc().wolfKingCanShootIfPoisoned));
    if(!used && !blockedByPoison){
      await updateGame({pending:Object.assign({},pending,{queue:queue,resolvedText:texts,awaiting:{seat:seatN,role:role}})});
      return;
    }
  }
  return processPendingQueue();
}
function factionTotals(){
  var t={wolf:0, good_god:0, good_villager:0};
  ROLE_LIST.forEach(function(r){ t[ROLES[r].faction] += roleConfigCounts()[r]||0; });
  return t;
}
/* 勝負判定：用「角色池總數 - 已知死亡且已標記身份的陣營人數」推算剩餘人數，
   不要求存活中的座位都已標記身份（因為身份是照真實遊玩節奏、遇到才標記的）。
   只要求「死亡的座位」都已經補標記身份，沒補齊就先不判斷，避免誤判。 */
function checkWin(){
  var totals = factionTotals();
  var deadByFaction = {wolf:0, good_god:0, good_villager:0};
  var deadUnknown = 0;
  seatNums().forEach(function(n){
    if(seatData(n).alive) return;
    var r = roleOfSeat(n);
    if(!r){ deadUnknown++; return; }
    deadByFaction[ROLES[r].faction]++;
  });
  if(deadUnknown>0) return null; // 有死亡座位還沒補標記身份，先不判斷
  var wolfAlive = totals.wolf - deadByFaction.wolf;
  var godAlive = totals.good_god - deadByFaction.good_god;
  var villagerAlive = totals.good_villager - deadByFaction.good_villager;
  if(wolfAlive<=0) return 'good';
  if(rc().factionWin==='city'){ if(godAlive<=0 && villagerAlive<=0) return 'wolf'; }
  else { if(godAlive<=0 || villagerAlive<=0) return 'wolf'; }
  return null;
}

async function actRevealDeaths(){
  var texts = state.game.pendingRevealTexts||[];
  for(var i=0;i<texts.length;i++){ await appendLog(texts[i]); }
  var jobs=[]; var newlyDead=[];
  seatNums().forEach(function(n){
    var s=seatData(n);
    if(s.alive===false && s.revealed===false){ jobs.push(updateSeat(n,{revealed:true})); newlyDead.push(n); }
  });
  await Promise.all(jobs);
  var next = state.game.afterReveal || 'lynch_vote';
  if(newlyDead.length){
    // 只有第一夜死亡的玩家有遺言（其餘夜裡死的都沒有）；這裡揭曉的一定是第一夜死訊，逐一走一輪遺言
    newlyDead.sort(function(a,b){return a-b;});
    await updateGame({pendingRevealTexts:[], afterReveal:null, lastWordsQueue:newlyDead, lastWordsNext:next, dayStagePrev:null});
  } else {
    await updateGame({pendingRevealTexts:[], dayStage:next, afterReveal:null, dayStagePrev:null});
  }
}

          + '<button class="btn btn-sm'+(cur===0?' btn-wolf':'')+'" data-act="god-cast-vote" data-vid="'+v.id+'" data-voter="'+voter+'" data-target="0">棄票</button>'

/* 「幾號投給誰」的明細，取代單純只顯示各候選人票數的長條圖——所有投票流程（警長選舉／放逐／
   純投票模式）共用同一個函式。棄票（target===0）自己獨立一行，排在最後面；投票還開著的話，
   底下再列一行還沒投票的座位號碼，方便上帝掌握進度。 */
function renderVoteBreakdown(v){
  var choices = v.choices||{};
  var tally = tallyOf(v);
  var groups = {};
  Object.keys(choices).forEach(function(seat){
    var target = choices[seat];
    var key = (target===0 || target==null) ? 'abstain' : String(target);
    (groups[key]=groups[key]||[]).push(Number(seat));
  });
  var keys = Object.keys(groups);
  var html = '';
  if(keys.length){
    keys.sort(function(a,b){
      if(a==='abstain') return 1;
      if(b==='abstain') return -1;
      return (tally[Number(b)]||0)-(tally[Number(a)]||0);
    });
    html += '<div class="stack" style="margin-top:2px;">' + keys.map(function(k){
      var voters = groups[k].slice().sort(function(a,b){return a-b;});
      var voterStr = voters.join('、')+' 號';
      if(k==='abstain'){
        return '<div class="vote-breakdown-row abstain"><span class="mono">'+voterStr+'</span><span class="arrow">→</span><span class="badge badge-muted">棄票・'+fmtWeight(tally[0]||0)+' 票</span></div>';
      }
      return '<div class="vote-breakdown-row"><span class="mono">'+voterStr+'</span><span class="arrow">→</span><span class="badge badge-wolf">'+k+' 號・'+fmtWeight(tally[Number(k)]||0)+' 票</span></div>';
    }).join('') + '</div>';
  } else {
    html += '<p class="small muted" style="margin-top:2px;">目前還沒有人投票。</p>';
  }
  if(v.open){
    var voted = Object.keys(choices).map(Number);
    var pending = (v.voters||[]).filter(function(n){ return voted.indexOf(n)<0; });
    if(pending.length){
      html += '<div class="vote-breakdown-row pending" style="margin-top:6px;"><span class="small muted">尚未投票：'+pending.join('、')+' 號</span></div>';
    }
  }
  return html;
}
function renderVoteCardFull(v,godView){
  var candidates = v.candidates || aliveSeatList();
  var canCast = !godView && v.open && ui.seat!=null && v.voters.indexOf(ui.seat)>=0;
  var html='<div class="card stack"><h2>'+esc(v.label)+'</h2>';
  if(godView && v.sheriffSeat!=null){
    html += '<label class="toggle-row"><span><span class="t-label">警長歸票（算 1.5 票）</span><br><span class="t-desc">警長（'+v.sheriffSeat+'號）口頭宣告投給誰後再勾選</span></span>'+toggleSwitch('sheriffDeclare:'+v.id, v.sheriffDeclared)+'</label>';
  }
  if(canCast){
    html += '<div class="btngrid">' + candidates.map(function(n){
        var mine = v.choices && v.choices[ui.seat]===n;
        return '<button class="btn btn-sm'+(mine?' btn-wolf':'')+'" data-act="cast-vote" data-vid="'+v.id+'" data-target="'+n+'">'+n+'</button>';
      }).join('')
      + '<button class="btn btn-sm'+(v.choices&&v.choices[ui.seat]===0?' btn-wolf':'')+'" data-act="cast-vote" data-vid="'+v.id+'" data-target="0">棄票</button>'
      + '</div>';
  }
  // 投票過程中只有上帝看得到「幾號投給誰」的明細；玩家要等投票結束（進入結果頁）才看得到，
  // 避免還在投票時互相看到票數影響判斷。
  if(godView || !v.open){
    html += renderVoteBreakdown(v);
  } else if(!godView){
    html += '<p class="small muted" style="margin-top:4px;">投票結果會在投票結束後公布，請耐心等候。</p>';
  }
  html += '</div>';
  return html;
}
function renderSheriffDeclareStep(v,kind){
  // 警長選舉本身跟「歸票」無關（這時候還沒有警長）——歸票只在放逐投票時才有意義，這裡的文字不能混為一談。
  var html='<div class="card stack"><h2>結果確認</h2>'
    + (kind==='lynch' ? '<p class="muted small">「警長歸票」開關在上方票數卡片裡，確認無誤後再判定結果。</p>' : '<p class="muted small">請確認投票結果無誤後再判定結果。</p>');
  var tally=tallyOf(v);
  var candidates=v.candidates||aliveSeatList();
  var sorted=candidates.slice().sort(function(a,b){return (tally[b]||0)-(tally[a]||0);});
  var top=tally[sorted[0]]||0;
  var tied=sorted.filter(function(n){return (tally[n]||0)===top && top>0;});
  if(tied.length>1 && kind==='sheriff'){
    html += '<p class="small" style="color:var(--accent-brass);">平票：'+tied.join('、')+' 號，將進入複選——只有平票的人重新發言，其餘存活玩家（不含平票候選人）重新投票。</p>';
    html += '<button class="btn btn-wolf btn-block" data-act="finish-vote" data-kind="sheriff" data-result="tie">進入複選</button>';
  } else if(tied.length>1){
    html += '<p class="small" style="color:var(--accent-brass);">平票：'+tied.join('、')+' 號，請主持人依現場規則處理（重新發言投票 / 平安夜 / 上帝裁定）。</p>';
    html += '<button class="btn btn-ghost btn-block" data-act="finish-vote" data-kind="'+kind+'" data-result="tie">記為平票，暫不出局</button>';
  } else if(top>0){
    html += '<p class="small">最高票：'+sorted[0]+' 號（'+fmtWeight(top)+' 票）。</p>';
    var confirmMsg = kind==='sheriff' ? ('確定 '+sorted[0]+' 號當選警長嗎？') : ('確定判定 '+sorted[0]+' 號出局嗎？這會觸發死亡結算，無法復原。');
    html += '<button class="btn btn-wolf btn-block" data-act="finish-vote" data-kind="'+kind+'" data-result="'+sorted[0]+'" data-confirm="'+confirmMsg+'">確認結果</button>';
  } else {
    html += '<p class="small muted">目前尚無票數。</p>';
  }
  html += '</div>';
  return html;
}
async function actOpenVote(kind){
  var candidates = kind==='sheriff' ? (state.game.candidates||[]) : aliveSeatList();
  var voters = aliveSeatList().filter(function(n){
    if(seatData(n).loseVoteRights) return false;
    if(kind==='sheriff' && candidates.indexOf(n)>=0) return false; // 上警競選的人這輪不能投票
    return true;
  });
  var id='round-'+Date.now();
  await db.collection('votes').doc(id).set({id:id,kind:kind,label:kind==='sheriff'?'警長選舉投票':('第 '+state.game.dayNumber+' 天放逐投票'),candidates:candidates,voters:voters,sheriffSeat: kind==='lynch'?state.game.sheriffSeat:null, sheriffDeclared:true, choices:{}, open:true, resolved:false, createdAt:nowIso()});
  await updateGame({activeVoteId:id});
}
/* 「發言結束，開始投票」按下去直接開票，不要再多一個「警長選舉投票／開始投票」的過渡畫面
   （那顆按鈕還是留著，是給投票開到一半按「取消本輪投票」之後要重新開一輪投票用的）。 */
async function actGotoSheriffVote(){
  await updateGame({dayStage:'sheriff_vote', dayStagePrev:'sheriff_speech'});
  await actOpenVote('sheriff');
}
async function actCloseVote(){
  await db.collection('votes').doc(state.game.activeVoteId).update({open:false});
}
async function actFinishVote(kind,result){
  var vid=state.game.activeVoteId;
  var v=state.votes[vid];
  await db.collection('votes').doc(vid).update({resolved:true});
  if(result==='tie'){
    if(kind==='sheriff'){
      // 平票進複選：候選名單縮小成只剩平票的人，重新抽一次隨機起點/順逆序發言，其餘存活玩家（不含這些候選人）重新投票
      var tally=tallyOf(v);
      var cands=v.candidates||[];
      var top=cands.length?Math.max.apply(null,cands.map(function(n){return tally[n]||0;})):0;
      var tied=cands.filter(function(n){return (tally[n]||0)===top;});
      var rsd=randomSeatAndDir();
      await appendLog('警長選舉平票（'+tied.join('、')+' 號），進入複選。');
      await updateGame({candidates:tied, speakStart:rsd.start, speakDir:rsd.dir, dayStage:'sheriff_speech', activeVoteId:null});
    }
    else { await appendLog('第 '+state.game.dayNumber+' 天投票結果平票，本輪無人出局。'); await updateGame({dayStage:null, phase:'night', nightNumber:(state.game.nightNumber||0)+1, nightStepIndex:-1, activeVoteId:null}); }
    return;
  }
  var target=Number(result);
  if(kind==='sheriff'){
    // 警長選舉整個流程（含複選）跑完，這時候才正式進入公布死訊（第一夜死訊在這之前都是保密的）
    await appendLog(target+' 號當選警長。'); // 選舉結果本身不用保密，這一刻大家本來就看得到票數
    if(!seatData(target).alive){
      // 當選的候選人其實已經死亡（只是死訊還沒公布）：警徽比照「警長死亡」統一處理，
      // 立刻問要轉移給誰還是撕毀，不能讓死人掛著警徽；「已死亡」這件事本身跟著其他死訊一起公布。
      // 死掉的警長沒辦法決定發言順序，所以不用經過「sheriff_order」這一步。
      await updateGame({
        sheriffSeat:target, activeVoteId:null, candidates:[], dayStage:'reveal', dayStagePrev:'sheriff_vote',
        pendingRevealTexts:(state.game.pendingRevealTexts||[]).concat([target+' 號警長其實已經死亡，警徽將轉移或作廢。']),
        pending:{ queue:[], awaiting:{seat:target,badgeTransfer:true}, context:'sheriff-dead-elect', resolvedText:[], suppressReveal:false }
      });
    } else {
      // 警長當選且還活著：先公布昨晚死訊（或平安夜），公布完才輪到警長決定發言順序——
      // 不是反過來先決定順序才公布。afterReveal 原本是 'lynch_vote'，這裡改指向 sheriff_order。
      await updateGame({sheriffSeat:target, activeVoteId:null, candidates:[], dayStage:'reveal', dayStagePrev:'sheriff_vote', afterReveal:'sheriff_order'});
    }
  } else {
    await updateGame({activeVoteId:null});
    await startResolution([{seat:target,cause:'vote'}],'day-after-vote', false, {votedSeat:target});
    await updateGame({dayStage:null});
  }
}

/* ============ Event 綁定 ============ */
$app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act=el.getAttribute('data-act');
  if(el.hasAttribute('data-confirm') && act!=='confirm-yes' && act!=='confirm-no'){
    ui.pendingConfirm = { msg: el.getAttribute('data-confirm'), act: act, dataset: Object.assign({}, el.dataset) };
    render();
    return;
  }
  handleAction(act, el);
});
$app.addEventListener('change', function(e){
  var el=e.target;
  if(el.matches('select[data-act="select"]')){
    var key=el.getAttribute('data-key');
    if(ui.setupDraft){ ui.setupDraft.ruleConfig[key]=el.value; render(); }
  }
  if(el.matches('[data-act="pin-draft"]')){
    if(ui.setupDraft){ ui.setupDraft.pin=el.value; }
  }
});

function handleAction(act, el){
  if(act==='confirm-yes'){
    var pc = ui.pendingConfirm; ui.pendingConfirm=null;
    var proxy = { getAttribute: function(name){
      var key = name.indexOf('data-')===0 ? name.slice(5) : name;
      key = key.replace(/-([a-z0-9])/g, function(_,c){return c.toUpperCase();});
      var v = pc.dataset[key];
      return v===undefined ? null : v;
    }};
    handleAction(pc.act, proxy);
    return;
  }
  if(act==='confirm-no'){ ui.pendingConfirm=null; render(); return; }
  if(act==='home'){ ui.view='mode-select'; render(); return; }
  if(act==='goto'){ ui.view=el.getAttribute('data-view'); render(); return; }
  if(act==='pick-mode'){
    var m=el.getAttribute('data-mode');
    if(m==='full'||m==='pure'){ ui.mode=m; LS.set('ww_mode',m); ui.view='main'; render(); return; }
    if(m==='__pure_god'){ ui.role='puregod'; render(); return; }
    if(m==='__pure_player'){ ui.role='pureplayer'; render(); return; }
    if(m==='__full_god'){ ui.role='fullgod'; render(); return; }
    if(m==='__full_player'){ ui.role='fullplayer'; render(); return; }
  }
  if(act==='switch-identity'){ ui.role=null; render(); return; }

  if(act==='pure-n'){
    var d=Number(el.getAttribute('data-d'));
    ui.setupDraft=ui.setupDraft||{}; ui.setupDraft.pureSeats=Math.max(2,Math.min(30,(ui.setupDraft.pureSeats||8)+d)); render(); return;
  }
  if(act==='pure-create'){
    var n=Number(el.getAttribute('data-n'));
    db.doc('pure/state').set({totalSeats:n, sheriffSeat:null, activeVoteId:null}); return;
  }
  if(act==='pure-claim'){
    var n=Number(el.getAttribute('data-n'));
    var nick=prompt('輸入暱稱（可留空）','')||'';
    claimSeat('pureSeats', n, {seatNumber:n,occupied:true,nickname:nick}).then(function(res){
      if(res.claimed){ ui.pureSeat=n; LS.set('ww_seat_pure',n); render(); }
      else { alert('這個座位已經有人了，請選其他座位。'); }
    });
    return;
  }
  if(act==='pure-set-sheriff'){
    var n=Number(el.getAttribute('data-n'));
    db.doc('pure/state').update({sheriffSeat: state.pure.sheriffSeat===n?null:n}); return;
  }
  if(act==='pure-reset'){
    Object.keys(state.pureSeats).forEach(function(k){ db.collection('pureSeats').doc(k).delete(); });
    db.doc('pure/state').set({totalSeats:0, sheriffSeat:null, activeVoteId:null});
    ui.pureSeat=null; LS.set('ww_seat_pure',null); return;
  }
  if(act==='pure-start-vote'){
    var label=($app.querySelector('#pureVoteLabel')||{}).value || '投票';
    var eligible=rangeArr(1,pureTotalSeats()).filter(function(n){return pureSeatData(n).occupied;});
    var id='pv-'+Date.now();
    db.collection('pureVotes').doc(id).set({id:id,label:label,candidates:eligible,voters:eligible,sheriffSeat:state.pure.sheriffSeat,sheriffDeclared:true,choices:{},open:true,createdAt:nowIso()});
    db.doc('pure/state').update({activeVoteId:id});
    return;
  }
  if(act==='pure-vote'){
    var target=Number(el.getAttribute('data-target'));
    var vid=pureLatestVoteId();
    if(ui.pureSeat==null){ alert('請先入座才能投票。'); return; }
    var choices=Object.assign({}, state.pureVotes[vid].choices);
    choices[ui.pureSeat]=target;
    db.collection('pureVotes').doc(vid).update({choices:choices});
    return;
  }
  if(act==='pure-close-vote'){
    var vid=pureLatestVoteId();
    db.collection('pureVotes').doc(vid).update({open:false});
    return;
  }

  if(act==='pin-key'){
    var k=el.getAttribute('data-k');
    if(k==='⌫'){ ui.pinBuf=ui.pinBuf.slice(0,-1); }
    else if(ui.pinBuf.length<4){ ui.pinBuf+=k; }
    if(ui.pinBuf.length===4){
      if(ui.pinBuf===state.game.godPin){ LS.set('ww_god_pin',ui.pinBuf); ui.pinBuf=''; render(); }
      else { alert('PIN 錯誤'); ui.pinBuf=''; render(); }
    } else render();
    return;
  }
  if(act==='role-n'){
    var r=el.getAttribute('data-r'); var d=Number(el.getAttribute('data-d'));
    ui.setupDraft.roleConfig[r]=Math.max(0,(ui.setupDraft.roleConfig[r]||0)+d); render(); return;
  }
  if(act==='toggle'){
    var key=el.getAttribute('data-key');
    if(key.indexOf('rule:')===0){
      var rk=key.slice(5); ui.setupDraft.ruleConfig[rk]=!ui.setupDraft.ruleConfig[rk]; render(); return;
    }
    if(key.indexOf('sheriffDeclare:')===0){
      var vid=key.slice(15);
      var v=state.votes[vid]||state.pureVotes[vid];
      var coll = state.votes[vid] ? 'votes' : 'pureVotes';
      db.collection(coll).doc(vid).update({sheriffDeclared: !v.sheriffDeclared});
      return;
    }
  }
  if(act==='create-game'){
    var d=ui.setupDraft;
    var total=0; ROLE_LIST.forEach(function(r){total+=d.roleConfig[r]||0;});
    if(total<3){ alert('人數太少，至少需要 3 人。'); return; }
    db.doc('game/state').set({
      phase:'lobby', dayNumber:0, nightNumber:1, nightStepIndex:0,
      roleConfig:d.roleConfig, ruleConfig:d.ruleConfig, totalSeats:total,
      godPin:d.pin, sheriffSeat:null, candidates:[], speakStart:null, speakDir:null, activeVoteId:null, dayStagePrev:null,
      dayStage:null, winner:null, log:[{t:nowIso(),text:'上帝建立了新的一局，共 '+total+' 人。'}], pending:null
    });
    LS.set('ww_god_pin', d.pin);
    ui.setupDraft=null; return;
  }
  if(act==='claim-seat'){
    var n=Number(el.getAttribute('data-n'));
    var nick=prompt('輸入暱稱（可留空）','')||'';
    claimSeat('seats', n, {seatNumber:n,occupied:true,nickname:nick,alive:true}).then(function(res){
      if(res.claimed){ ui.seat=n; LS.set('ww_seat_full',n); render(); }
      else { alert('這個座位已經有人了，請選其他座位。'); }
    });
    return;
  }
  if(act==='start-night1'){
    db.doc('game/state').update({phase:'night'}); return;
  }
  if(act==='forgot-pin-open'){ ui.forgotPinOpen=true; render(); return; }
  if(act==='forgot-pin-cancel'){ ui.forgotPinOpen=false; render(); return; }
  if(act==='forgot-pin-confirm'){
    var typed = (($app.querySelector('#forgotPinText')||{}).value || '').trim();
    if(typed!==FORGOT_PIN_PHRASE){ alert('文字沒有完全輸入正確，沒有重置。'); return; }
    ui.forgotPinOpen=false;
    handleAction('reset-game', el);
    return;
  }
  if(act==='reset-game'){
    Object.keys(state.seats).forEach(function(k){ db.collection('seats').doc(k).delete(); });
    Object.keys(state.roles).forEach(function(k){ db.collection('roles').doc(k).delete(); });
    Object.keys(state.nightlog).forEach(function(k){ db.collection('nightlog').doc(k).delete(); });
    Object.keys(state.votes).forEach(function(k){ db.collection('votes').doc(k).delete(); });
    db.doc('game/state').delete();
    ui.seat=null; LS.set('ww_seat_full',null);
    return;
  }
  if(act==='toggle-alive'){
    var n=Number(el.getAttribute('data-n'));
    updateSeat(n,{alive: !seatData(n).alive}); return;
  }
  if(act==='clear-seat'){
    var n=Number(el.getAttribute('data-n'));
    db.collection('seats').doc(String(n)).delete();
    if(ui.seat===n){ ui.seat=null; LS.set('ww_seat_full',null); }
    ui.pickSeatRole=null; render();
    return;
  }
  if(act==='pick-role-for-seat'){ ui.pickSeatRole=Number(el.getAttribute('data-n')); render(); return; }
  if(act==='close-pick-role'){ ui.pickSeatRole=null; render(); return; }
  if(act==='set-seat-role'){
    var n=Number(el.getAttribute('data-n'));
    var r=el.getAttribute('data-r')||null;
    // 不管這個座位原本有沒有開手機入座，標記身份就視同入座，座位管理才不會卡在「只能改名字」。
    var applyRole=function(){ updateRole(n,{role:r}); updateSeat(n,{occupied:true}); ui.pickSeatRole=null; render(); };
    if(r){
      // 名額已經滿了的話，把身份從原本持有的座位搬過來，這樣才能真的「換身份」
      var need=roleConfigCounts()[r]||0;
      var holders=findSeatsWithRole(r).filter(function(s){return s!==n;});
      if(holders.length>=need && holders.length>0){
        updateRole(holders[0],{role:null}).then(applyRole);
        return;
      }
    }
    applyRole();
    return;
  }
  if(act==='update-seat-nick'){
    var n=Number(el.getAttribute('data-n'));
    var nick=(($app.querySelector('#editSeatNick')||{}).value||'').trim();
    updateSeat(n,{nickname:nick, occupied:true});
    return;
  }
  if(act==='night-skip'){ nightAdvance(); return; }
  if(act==='night-back'){ actNightBack(); return; }
  if(act==='night-seer-back'){ actSeerBack(); return; }
  if(act==='undo-identify'){ actUndoIdentify(el.getAttribute('data-group')); return; }
  if(act==='night-guard'){ actNightGuard(Number(el.getAttribute('data-n'))); return; }
  if(act==='night-wolf'){ actNightWolf(Number(el.getAttribute('data-n'))); return; }
  if(act==='night-charm'){ actNightCharm(Number(el.getAttribute('data-n'))); return; }
  if(act==='night-witch-save'){ actWitchSave(Number(el.getAttribute('data-n'))); return; }
  if(act==='night-witch-poison'){ actWitchPoison(Number(el.getAttribute('data-n'))); return; }
  if(act==='night-seer'){ actNightSeer(Number(el.getAttribute('data-n'))); return; }
  if(act==='resolve-night'){ resolveNight(); return; }
  if(act==='pending-shoot'){ actPendingShoot(Number(el.getAttribute('data-n'))); return; }
  if(act==='assign-role-quick'){ actAssignRoleQuick(Number(el.getAttribute('data-n')), el.getAttribute('data-r')); return; }
  if(act==='toggle-wolf-identify'){
    var n=Number(el.getAttribute('data-n'));
    var picked=(ui.wolfIdentifyPicked||[]).slice();
    var i=picked.indexOf(n);
    if(i>=0) picked.splice(i,1); else picked.push(n);
    ui.wolfIdentifyPicked=picked; render();
    return;
  }
  if(act==='confirm-wolf-identify'){
    var picked=ui.wolfIdentifyPicked||[];
    Promise.all(picked.map(function(n){ return updateRole(n,{role:'wolf'}); })).then(function(){
      ui.wolfIdentifyPicked=null; render();
    });
    return;
  }
  if(act==='assign-death-role'){ actAssignDeathRole(Number(el.getAttribute('data-n')), el.getAttribute('data-r')); return; }

  if(act==='toggle-candidate'){
    var n=Number(el.getAttribute('data-n'));
    var cands=(state.game.candidates||[]).slice();
    var i=cands.indexOf(n);
    if(i>=0) cands.splice(i,1); else cands.push(n);
    updateGame({candidates:cands}); return;
  }
  if(act==='confirm-candidates'){ actConfirmCandidates(); return; }
  if(act==='skip-sheriff'){ updateGame({dayStage:'reveal', afterReveal:'lynch_vote', sheriffSeat:null, dayStagePrev:'sheriff_call'}); return; }
  if(act==='reveal-deaths'){ actRevealDeaths(); return; }
  if(act==='last-words-next'){ actLastWordsNext(); return; }
  if(act==='assign-seer-target-role'){ actAssignSeerTargetRole(Number(el.getAttribute('data-n')), el.getAttribute('data-r')); return; }
  if(act==='night-witch-nosave'){ actWitchDeclineAntidote(); return; }
  if(act==='night-witch-nopoison'){ actWitchDeclinePoison(); return; }
  if(act==='night-witch-back-antidote'){ actWitchBackToAntidote(); return; }
  if(act==='night-gate-start'){ updateGame({nightStepIndex:0}); return; }
  if(act==='goto-sheriff-vote'){ actGotoSheriffVote(); return; }
  if(act==='sheriff-order-done'){ updateGame({dayStage:'lynch_vote', dayStagePrev:null}); return; }
  if(act==='day-back'){ actDayBack(); return; }
  if(act==='cancel-vote'){ actCancelVote(); return; }
  if(act==='open-vote'){ actOpenVote(el.getAttribute('data-kind')); return; }
  if(act==='close-vote'){ actCloseVote(); return; }
  if(act==='cast-vote'){
    var vid=el.getAttribute('data-vid'); var target=Number(el.getAttribute('data-target'));
    if(ui.seat==null){ alert('請先入座才能投票。'); return; }
    var v=state.votes[vid];
    if(v.voters.indexOf(ui.seat)<0){ alert('這一輪投票你沒有投票資格。'); return; }
    var choices=Object.assign({},v.choices); choices[ui.seat]=target;
    db.collection('votes').doc(vid).update({choices:choices}); return;
  }
  if(act==='god-cast-vote'){
    var vid=el.getAttribute('data-vid'); var voter=Number(el.getAttribute('data-voter')); var target=Number(el.getAttribute('data-target'));
    var v=state.votes[vid]; if(!v) return;
    var choices=Object.assign({},v.choices); choices[voter]=target;
    db.collection('votes').doc(vid).update({choices:choices}); return;
  }
  if(act==='finish-vote'){ actFinishVote(el.getAttribute('data-kind'), el.getAttribute('data-result')); return; }
  if(act==='pending-badge-transfer'){ actPendingBadgeTransfer(Number(el.getAttribute('data-n'))); return; }
  if(act==='wwk-detonate'){
    actWhiteWolfDetonate(Number(el.getAttribute('data-n'))); return;
  }
  if(act==='knight-start'){ ui.targetSel='knight'; render(); return; }
  if(act==='knight-cancel'){ ui.targetSel=null; render(); return; }
  if(act==='knight-duel'){
    ui.targetSel=null;
    actKnightDuel(Number(el.getAttribute('data-k')), Number(el.getAttribute('data-n')));
    return;
  }
}

})();
</script>
</body>
</html>
